居留地；产地；","example":"The panda's habitat is in the mountains of China.","translation":"熊猫的栖息地在中国的山区。"},{"id":"动物学-6","cat":"动物学","word":"nesting place","ipa":"/ˈnɛstɪŋ pleɪs/","meaning":"phrase. 筑巢的地方","example":"The bird found a safe nesting place in the tree.","translation":"鸟在树上找到了一个安全的筑巢地点。"},{"id":"动物学-7","cat":"动物学","word":"creature","ipa":"ˈkriːtʃə(r)","meaning":"n. 生物；动物；","example":"The creature lived in the forest.","translation":"这个生物生活在森林里。"},{"id":"动物学-8","cat":"动物学","word":"gene","ipa":"dʒiːn","meaning":"n. 基因","example":"He has a gene that makes him tall.","translation":"他有一个让他长高的基因。"},{"id":"动物学-9","cat":"动物学","word":"herbivorous","ipa":"hɜːˈbɪvərəs","meaning":"adj. 食草的","example":"The deer is herbivorous.","translation":"这只鹿是食草的。"},{"id":"动物学-10","cat":"动物学","word":"carnivorous","ipa":"kɑːˈnɪvərəs","meaning":"adj. 食肉的","example":"The lion is a carnivorous animal.","translation":"狮子是一种食肉动物。"},{"id":"动物学-11","cat":"动物学","word":"omnivorous","ipa":"ɒmˈnɪvərəs","meaning":"adj. 杂食的；","example":"Bears are omnivorous animals.","translation":"熊是杂食动物。"},{"id":"动物学-12","cat":"动物学","word":"mammals","ipa":"ˈmæm(ə)lz","meaning":"n. 哺乳动物；“mammal”的复数；","example":"Dogs and cats are mammals.","translation":"狗和猫是哺乳动物。"},{"id":"动物学-13","cat":"动物学","word":"vertebrate","ipa":"ˈvɜːtɪbrət","meaning":"n. 脊椎动物；","example":"Fish and birds are vertebrates.","translation":"鱼和鸟是脊椎动物。"},{"id":"动物学-14","cat":"动物学","word":"backbone  spine","ipa":"ˈbæk.bəʊn spaɪn","meaning":"phrase. 脊柱；脊梁；骨干","example":"The backbone supports the body and protects the spine.","translation":"脊柱支撑身体并保护脊髓。"},{"id":"动物学-15","cat":"动物学","word":"reptile","ipa":"ˈreptaɪl","meaning":"n. 爬行动物；","example":"A snake is a reptile.","translation":"蛇是一种爬行动物。"},{"id":"动物学-16","cat":"动物学","word":"amphibian","ipa":"æmˈfɪbiən","meaning":"n. 两栖动物","example":"The frog is an amphibian.","translation":"青蛙是一种两栖动物。"},{"id":"动物学-17","cat":"动物学","word":"species","ipa":"ˈspiːʃiːz","meaning":"n. 物种；种类；","example":"This forest has many different species of birds.","translation":"这片森林有多种不同的鸟类物种。"},{"id":"动物学-18","cat":"动物学","word":"calf","ipa":"kɑːf","meaning":"n. 小牛；牛犊；","example":"The farmer feeds the calf every morning.","translation":"农夫每天早上喂小牛。"},{"id":"动物学-19","cat":"动物学","word":"chick","ipa":"tʃɪk","meaning":"n. 小鸡；雏鸟","example":"The chick is following its mother.","translation":"小鸡跟着它的妈妈。"},{"id":"动物学-20","cat":"动物学","word":"pet","ipa":"pet","meaning":"n. 宠物；","example":"My dog is my favorite pet.","translation":"我的狗是我最喜欢的宠物。"},{"id":"动物学-21","cat":"动物学","word":"lion","ipa":"ˈlaɪən","meaning":"n. 狮子","example":"The lion roars loudly in the wild.","translation":"狮子在野外大声吼叫。"},{"id":"动物学-22","cat":"动物学","word":"monkey","ipa":"ˈmʌŋki","meaning":"n. 猴子","example":"The monkey is eating a banana.","translation":"猴子正在吃一根香蕉。"},{"id":"动物学-23","cat":"动物学","word":"snake","ipa":"sneɪk","meaning":"n. 蛇；","example":"The snake crawled slowly through the grass.","translation":"蛇在草丛中缓慢地爬行。"},{"id":"动物学-24","cat":"动物学","word":"rabbit","ipa":"ˈræbɪt","meaning":"n. 兔子","example":"The rabbit jumps over the small fence.","translation":"兔子跳过了小篱笆。"},{"id":"动物学-25","cat":"动物学","word":"bear","ipa":"beə(r)","meaning":"n. 熊；\nv. 承受；忍受；带有；生（孩子）；","example":"A bear walked near the campsite.","translation":"一只熊在露营地附近走动。"},{"id":"动物学-26","cat":"动物学","word":"ape","ipa":"eɪp","meaning":"n. 猿；","example":"The ape climbed slowly up the tree.","translation":"这只猿慢慢爬上了树。"},{"id":"动物学-27","cat":"动物学","word":"crocodile","ipa":"ˈkrɒkədaɪl","meaning":"n. 鳄鱼","example":"The crocodile is swimming in the river.","translation":"鳄鱼正在河里游泳。"},{"id":"动物学-28","cat":"动物学","word":"insect","ipa":"ˈɪnsekt","meaning":"n. 昆虫","example":"The insect flew over the grass.","translation":"那只昆虫飞过了草地。"},{"id":"动物学-29","cat":"动物学","word":"whale","ipa":"weɪl","meaning":"n. 鲸；","example":"The whale swims deep in the ocean.","translation":"鲸在海洋深处游动。"},{"id":"动物学-30","cat":"动物学","word":"goose  geese","ipa":"ɡuːs giːz","meaning":"phrase. 鹅；雌鹅；笨蛋（复数形式为 geese）","example":"The goose flew over the lake, and now there are many geese in the pond.","translation":"那只鹅飞过了湖，现在池塘里有许多鹅。"},{"id":"动物学-31","cat":"动物学","word":"swan","ipa":"swɒn","meaning":"n. 天鹅；","example":"A white swan swam quietly on the lake.","translation":"一只白天鹅静静地在湖上游泳。"},{"id":"动物学-32","cat":"动物学","word":"frog","ipa":"frɒɡ","meaning":"n. 青蛙","example":"The frog jumps over the pond.","translation":"青蛙跳过池塘。"},{"id":"动物学-33","cat":"动物学","word":"dinosaur","ipa":"ˈdaɪnəsɔː(r)","meaning":"n. 恐龙","example":"The child loves to watch dinosaurs on TV.","translation":"这个孩子喜欢在电视上看恐龙。"},{"id":"动物学-34","cat":"动物学","word":"pigeon","ipa":"ˈpɪdʒɪn","meaning":"n. 鸽子","example":"The pigeon sits on the window sill.","translation":"鸽子坐在窗台上。"},{"id":"动物学-35","cat":"动物学","word":"donkey","ipa":"ˈdɒŋki","meaning":"n. 驴","example":"The donkey carries water on the hill.","translation":"这头驴在山上驮水。"},{"id":"动物学-36","cat":"动物学","word":"camel","ipa":"ˈkæm(ə)l","meaning":"n. 骆驼","example":"The camel walks slowly across the desert.","translation":"骆驼缓慢地走过沙漠。"},{"id":"动物学-37","cat":"动物学","word":"hen","ipa":"hen","meaning":"n. 母鸡","example":"The hen is laying eggs in the coop.","translation":"母鸡正在鸡舍里下蛋。"},{"id":"动物学-38","cat":"动物学","word":"lamb","ipa":"læm","meaning":"n. 羔羊；小羊；羔羊肉；","example":"The farmer feeds the lamb every morning.","translation":"农夫每天早上喂羔羊。"},{"id":"动物学-39","cat":"动物学","word":"pony","ipa":"ˈpəʊni","meaning":"n. 小型马；","example":"The child rides a pony in the park.","translation":"孩子在公园里骑小马。"},{"id":"动物学-40","cat":"动物学","word":"bull","ipa":"bʊl","meaning":"n. 公牛；大型雄性动物；胡扯；废话","example":"The bull charged at the matador.","translation":"公牛冲向了斗牛士。"},{"id":"动物学-41","cat":"动物学","word":"goat","ipa":"ɡəʊt","meaning":"n. 山羊","example":"The goat eats grass in the field.","translation":"山羊在田野里吃草。"},{"id":"动物学-42","cat":"动物学","word":"deer","ipa":"dɪə(r)","meaning":"n. 鹿","example":"A deer is walking in the forest.","translation":"一只鹿正在森林里走路。"},{"id":"动物学-43","cat":"动物学","word":"giraffe","ipa":"dʒəˈrɑːf","meaning":"n. 长颈鹿","example":"The giraffe eats leaves from tall trees.","translation":"长颈鹿吃高树上的叶子。"},{"id":"动物学-44","cat":"动物学","word":"elephant","ipa":"ˈelɪfənt","meaning":"n. 大象","example":"The elephant walks slowly in the zoo.","translation":"大象在动物园里慢慢走。"},{"id":"动物学-45","cat":"动物学","word":"puma","ipa":"ˈpjuːmə","meaning":"n. 美洲狮","example":"A puma ran quickly through the forest.","translation":"一只美洲狮快速跑过森林。"},{"id":"动物学-46","cat":"动物学","word":"leopard","ipa":"ˈlepəd","meaning":"n. 豹","example":"The leopard runs fast in the wild.","translation":"豹在野外跑得很快。"},{"id":"动物学-47","cat":"动物学","word":"jaguar","ipa":"ˈdʒæɡjuə(r)","meaning":"n. 美洲虎","example":"The jaguar runs fast in the rainforest.","translation":"美洲豹在雨林中跑得很快。"},{"id":"动物学-48","cat":"动物学","word":"fox","ipa":"fɒks","meaning":"n. 狐狸；","example":"The fox ran quickly through the forest.","translation":"狐狸快速地跑过森林。"},{"id":"动物学-49","cat":"动物学","word":"squirrel","ipa":"ˈskwɪrəl","meaning":"n. 松鼠；","example":"The squirrel ran up the tree with a nut.","translation":"松鼠带着一颗坚果跑上了树。"},{"id":"动物学-50","cat":"动物学","word":"hare","ipa":"heə(r)","meaning":"n. 野兔","example":"The hare runs fast in the field.","translation":"野兔在田野里跑得很快。"},{"id":"动物学-51","cat":"动物学","word":"chimpanzee","ipa":"ˌtʃɪmpænˈziː","meaning":"n. 黑猩猩","example":"The chimpanzee is eating a banana.","translation":"这只黑猩猩正在吃一根香蕉。"},{"id":"动物学-52","cat":"动物学","word":"gorilla","ipa":"ɡəˈrɪlə","meaning":"n. 大猩猩","example":"The gorilla sits quietly in the forest.","translation":"大猩猩静静地坐在森林里。"},{"id":"动物学-53","cat":"动物学","word":"kangaroo","ipa":"ˌkæŋɡəˈruː","meaning":"n. 袋鼠","example":"The kangaroo jumps high in the Australian wild.","translation":"袋鼠在澳大利亚的野外跳得很高。"},{"id":"动物学-54","cat":"动物学","word":"koala","ipa":"kəʊˈɑːlə","meaning":"n. 树袋熊；考拉熊；无尾熊；","example":"The koala sleeps in a eucalyptus tree.","translation":"树袋熊在桉树上睡觉。"},{"id":"动物学-55","cat":"动物学","word":"bat","ipa":"bæt","meaning":"n. 蝙蝠；","example":"A bat flew out of the cave at night.","translation":"一只蝙蝠在晚上从洞穴里飞了出来。"},{"id":"动物学-56","cat":"动物学","word":"dolphin","ipa":"ˈdɒlfɪn","meaning":"n. 海豚","example":"The dolphin jumped high out of the water.","translation":"海豚从水中高高跳起。"},{"id":"动物学-57","cat":"动物学","word":"falcon","ipa":"ˈfɔːlkən","meaning":"n. 猎鹰","example":"The falcon flew high above the mountains.","translation":"猎鹰在群山上空飞翔。"},{"id":"动物学-58","cat":"动物学","word":"ostrich","ipa":"ˈɒstrɪtʃ","meaning":"n. 鸵鸟","example":"The ostrich runs very fast on the grassland.","translation":"鸵鸟在草原上跑得很快。"},{"id":"动物学-59","cat":"动物学","word":"parrot","ipa":"ˈpærət","meaning":"n. 鹦鹉；学舌者；","example":"The parrot can say hello.","translation":"这只鹦鹉会说你好。"},{"id":"动物学-60","cat":"动物学","word":"stork","ipa":"stɔːk","meaning":"n. 鹳；","example":"The stork flew over the house with a baby in its beak.","translation":"鹳叼着婴儿飞过房子。"},{"id":"动物学-61","cat":"动物学","word":"swallow","ipa":"ˈswɒləʊ","meaning":"v. 吞咽；","example":"He swallowed the pill with water.","translation":"他用水吞下了药片。"},{"id":"动物学-62","cat":"动物学","word":"song thrush","ipa":"sɒŋ θrʌʃ","meaning":"phrase. 欧歌鸫","example":"The song thrush sings loudly in the morning.","translation":"歌鸫在早晨大声歌唱。"},{"id":"动物学-63","cat":"动物学","word":"lizard","ipa":"ˈlɪzəd","meaning":"n. 蜥蜴","example":"The lizard sits on the rock in the sun.","translation":"蜥蜴趴在阳光下的石头上。"},{"id":"动物学-64","cat":"动物学","word":"toad","ipa":"təʊd","meaning":"n. 蟾蜍；癞蛤蟆；讨厌的人","example":"A toad sits near the pond.","translation":"一只蟾蜍坐在池塘边。"},{"id":"动物学-65","cat":"动物学","word":"seal","ipa":"siːl","meaning":"v. 密封；封上；","example":"He sealed the envelope with glue.","translation":"他用胶水把信封封上了。"},{"id":"动物学-66","cat":"动物学","word":"jellyfish","ipa":"ˈdʒelifɪʃ","meaning":"n. 水母；","example":"The jellyfish floated gently in the sea.","translation":"水母在海里轻轻漂浮。"},{"id":"动物学-67","cat":"动物学","word":"hedgehog","ipa":"ˈhedʒhɒɡ","meaning":"n. 刺猬","example":"The hedgehog walks slowly in the garden.","translation":"刺猬在花园里慢慢走。"},{"id":"动物学-68","cat":"动物学","word":"leatherback turtle","ipa":"ˈleðəbæk ˈtɜːtl","meaning":"phrase. 棱皮龟（世界上最大的海龟，背甲革质而非硬壳）","example":"The leatherback turtle swims far across the ocean.","translation":"棱皮龟游过遥远的海洋。"},{"id":"动物学-69","cat":"动物学","word":"Insect","ipa":"ˈɪnsekt","meaning":"n. 昆虫","example":"The insect flew over the grass.","translation":"那只昆虫飞过了草地。"},{"id":"动物学-70","cat":"动物学","word":"termites","ipa":"/ˈtɜː.maɪts/","meaning":"n. 白蚁","example":"Termites eat wood in the old house.","translation":"白蚁吃老房子里的木头。"},{"id":"动物学-71","cat":"动物学","word":"butterfly","ipa":"ˈbʌtəflaɪ","meaning":"n. 蝴蝶","example":"A butterfly is flying over the flowers.","translation":"一只蝴蝶在花上飞舞。"},{"id":"动物学-72","cat":"动物学","word":"dragonfly","ipa":"ˈdræɡənflaɪ","meaning":"n. 蜻蜓","example":"The dragonfly flies fast over the pond.","translation":"蜻蜓在池塘上快速飞行。"},{"id":"动物学-73","cat":"动物学","word":"crickets","ipa":"ˈkrɪkɪts","meaning":"n. 板球; 蟋蟀( cricket的名词复数 )","example":"He plays crickets every weekend with his friends.","translation":"他每个周末都和朋友打板球。"},{"id":"动物学-74","cat":"动物学","word":"cocoon","ipa":"kəˈkuːn","meaning":"n. 茧；","example":"The caterpillar spun a cocoon around itself.","translation":"毛毛虫为自己织了一个茧。"},{"id":"动物学-75","cat":"动物学","word":"silkworm","ipa":"ˈsɪlkwɜːm","meaning":"n. 蚕；","example":"The silkworm eats mulberry leaves.","translation":"蚕吃桑叶。"},{"id":"动物学-76","cat":"动物学","word":"cicada","ipa":"sɪˈkɑːdə","meaning":"n. 蝉；知了；","example":"The cicada sang loudly in the summer tree.","translation":"蝉在夏天的树上大声鸣叫。"},{"id":"动物学-77","cat":"动物学","word":"grasshopper","ipa":"ˈɡrɑːshɒpə(r)","meaning":"n. 蝗虫；蚂蚱","example":"The grasshopper jumps high in the grass.","translation":"蚱蜢在草丛中跳得很高。"},{"id":"动物学-78","cat":"动物学","word":"leech","ipa":"liːtʃ","meaning":"n. 水蛭；吸血鬼；榨取他人利益的人\nv. 以水蛭吸血；依附并榨取别人","example":"The leech stuck to his leg in the pond.","translation":"水蛭粘在他的腿上，是在池塘里。"},{"id":"动物学-79","cat":"动物学","word":"cockroach","ipa":"ˈkɒkrəʊtʃ","meaning":"n. 蟑螂","example":"A cockroach ran across the kitchen floor.","translation":"一只蟑螂跑过了厨房的地板。"},{"id":"动物学-80","cat":"动物学","word":"beetle","ipa":"ˈbiːt(ə)l","meaning":"n. 甲虫","example":"The beetle crawls on the leaf.","translation":"甲虫在叶子上爬行。"},{"id":"动物学-81","cat":"动物学","word":"locust","ipa":"ˈləʊkəst","meaning":"n. 蝗虫","example":"The locust flew over the field.","translation":"蝗虫飞过了田野。"},{"id":"动物学-82","cat":"动物学","word":"mosquito","ipa":"məˈskiːtəʊ","meaning":"n. 蚊子","example":"A mosquito bit my arm last night.","translation":"一只蚊子昨晚咬了我的胳膊。"},{"id":"动物学-83","cat":"动物学","word":"spider","ipa":"ˈspaɪdə(r)","meaning":"n. 蜘蛛","example":"A spider is crawling on the wall.","translation":"一只蜘蛛正在墙上爬。"},{"id":"动物学-84","cat":"动物学","word":"mantis","ipa":"ˈmæntɪs","meaning":"n. [昆]螳螂; n. （Mantis）人名；（西）曼蒂斯","example":"The mantis sits quietly on the leaf.","translation":"螳螂静静地坐在叶子上。"},{"id":"动物学-85","cat":"动物学","word":"worm","ipa":"wɜːm","meaning":"n. 蠕虫","example":"The bird ate a worm.","translation":"鸟吃了一条蚯蚓。"},{"id":"动物学-86","cat":"动物学","word":"bug","ipa":"bʌɡ","meaning":"n. 小虫子；","example":"A bug crawled on the leaf.","translation":"一只小虫子爬在叶子上。"},{"id":"动物学-87","cat":"动物学","word":"others","ipa":"ˈʌðəz","meaning":"n. 别人；其他的事物；","example":"He helped others without asking for anything.","translation":"他帮助别人，没有要求任何回报。"},{"id":"动物学-88","cat":"动物学","word":"fungi","ipa":"ˈfʌŋɡiː","meaning":"n. 霉菌；菌类；真菌；“fungus”的复数；","example":"The bread has fungi growing on it.","translation":"面包上长了霉菌。"},{"id":"动物学-89","cat":"动物学","word":"germ","ipa":"dʒɜːm","meaning":"n. 病菌；","example":"Washing hands can kill germs.","translation":"洗手可以杀死病菌。"},{"id":"动物学-90","cat":"动物学","word":"wing","ipa":"wɪŋ","meaning":"n. 翅膀；翼；","example":"The bird spread its wing to fly.","translation":"鸟张开翅膀飞翔。"},{"id":"动物学-91","cat":"动物学","word":"nest","ipa":"nest","meaning":"n. 窝；鸟巢；\nv. 筑巢；","example":"The bird built a nest in the tree.","translation":"鸟在树上筑了一个窝。"},{"id":"动物学-92","cat":"动物学","word":"creep","ipa":"kriːp","meaning":"v. 蹑手蹑脚地走；","example":"The cat creeps slowly toward the bird.","translation":"猫蹑手蹑脚地向鸟靠近。"},{"id":"动物学-93","cat":"动物学","word":"pollen","ipa":"ˈpɒlən","meaning":"n. 花粉","example":"Bees collect pollen from flowers.","translation":"蜜蜂从花朵中采集花粉。"},{"id":"动物学-94","cat":"动物学","word":"insecticide","ipa":"ɪnˈsektɪsaɪd","meaning":"n. 杀虫剂；杀虫药；","example":"Farmers use insecticide to kill bugs on crops.","translation":"农民使用杀虫剂来杀死作物上的害虫。"},{"id":"动物学-95","cat":"动物学","word":"pesticide","ipa":"ˈpestɪsaɪd","meaning":"n. 杀虫剂；除害药物；","example":"Farmers use pesticide to kill insects on crops.","translation":"农民使用杀虫剂来杀死作物上的昆虫。"},{"id":"动物学-96","cat":"动物学","word":"food chain","ipa":"ˈfuːd tʃeɪn","meaning":"phrase. 食物链","example":"The lion is at the top of the food chain.","translation":"狮子处于食物链的顶端。"},{"id":"动物学-97","cat":"动物学","word":"jaw","ipa":"dʒɔː","meaning":"n. 颚；颌；下巴；","example":"He hurt his jaw when he fell.","translation":"他摔倒时伤到了下巴。"},{"id":"动物学-98","cat":"动物学","word":"tongue","ipa":"tʌŋ","meaning":"n. 语言；舌头；","example":"He speaks Chinese as his mother tongue.","translation":"他把汉语作为母语。"},{"id":"动物学-99","cat":"动物学","word":"scent","ipa":"sent","meaning":"n. 香味；香水；气息；察觉；","example":"The flower has a sweet scent.","translation":"这朵花有甜美的香味。"},{"id":"动物学-100","cat":"动物学","word":"grease","ipa":"ɡriːs","meaning":"n. 油脂；","example":"The cook wiped off the grease from the pan.","translation":"厨师把锅上的油脂擦掉了。"},{"id":"动物学-101","cat":"动物学","word":"claw","ipa":"klɔː","meaning":"n. 爪；钳\nv. 抓","example":"The cat used its claw to scratch the tree.","translation":"猫用爪子抓树。"},{"id":"动物学-102","cat":"动物学","word":"feather","ipa":"ˈfeðə(r)","meaning":"n. 羽毛","example":"The bird has a soft feather.","translation":"这只鸟有一根柔软的羽毛。"},{"id":"动物学-103","cat":"动物学","word":"breed","ipa":"briːd","meaning":"v. 交配繁殖；饲养；促进；催生；n. 品种；","example":"The farmers breed cows to get more milk.","translation":"农民让奶牛交配繁殖以获得更多牛奶。"},{"id":"动物学-104","cat":"动物学","word":"rear","ipa":"rɪə(r)","meaning":"n. 后部；\nv. 饲养；抚养；\nadj. 后面的；","example":"The rear of the car was damaged in the accident.","translation":"汽车的后部在事故中受损了。"},{"id":"动物学-105","cat":"动物学","word":"feed","ipa":"fiːd","meaning":"v. 喂；吃；\nn. 饲养；喂养；","example":"She feeds the cat every morning.","translation":"她每天早上喂猫。"},{"id":"动物学-106","cat":"动物学","word":"hatch","ipa":"hætʃ","meaning":"v. 孵出；","example":"The bird hatched her eggs after three weeks.","translation":"这只鸟在三周后孵出了她的蛋。"},{"id":"动物学-107","cat":"动物学","word":"incubator","ipa":"ˈɪŋkjubeɪtə(r)","meaning":"n. 孵卵器；育婴箱；培养的器具","example":"The eggs are kept in an incubator to hatch.","translation":"鸡蛋放在孵卵器里孵化。"},{"id":"动物学-108","cat":"动物学","word":"scale","ipa":"skeɪl","meaning":"n. 规模；等级；比例（尺）；刻度；秤；\nv. 改变…大小；","example":"The scale of the project surprised everyone.","translation":"这个项目的规模让所有人都感到惊讶。"},{"id":"动物学-109","cat":"动物学","word":"fin","ipa":"fɪn","meaning":"n. 鳍；","example":"The fish swam fast using its fin.","translation":"鱼用它的鳍快速游动。"},{"id":"动物学-110","cat":"动物学","word":"beak  bill","ipa":"biːk bɪl","meaning":"phrase. 鸟喙；尖嘴（指鸟类的嘴，形状如钩或锥，用于啄食）","example":"The bird used its beak bill to pick up seeds.","translation":"这只鸟用它的鸟喙啄起种子。"},{"id":"动物学-111","cat":"动物学","word":"paw","ipa":"pɔː","meaning":"n. 爪子；脚爪","example":"The cat licked its paw.","translation":"猫舔它的爪子。"},{"id":"动物学-112","cat":"动物学","word":"fang","ipa":"fæŋ","meaning":"n. 尖牙","example":"The dog showed its fang.","translation":"狗露出了它的獠牙。"},{"id":"动物学-113","cat":"动物学","word":"horn","ipa":"hɔːn","meaning":"n. 角；号角；喇叭","example":"The cow has two long horns.","translation":"这头牛有两只长角。"},{"id":"动物学-114","cat":"动物学","word":"oak tree","ipa":"əʊk triː","meaning":"phrase. 橡树；栎树","example":"The oak tree stands tall in the backyard.","translation":"橡树站在后院里。"},{"id":"动物学-115","cat":"动物学","word":"mulberry","ipa":"ˈmʌlbəri","meaning":"n. 桑树；","example":"The mulberry tree grows near the old house.","translation":"桑树长在老房子附近。"},{"id":"动物学-116","cat":"动物学","word":"coral","ipa":"ˈkɒrəl","meaning":"n. 珊瑚；","example":"The fish swim among the coral in the sea.","translation":"鱼在海中的珊瑚间游动。"},{"id":"动物学-117","cat":"动物学","word":"ripen","ipa":"ˈraɪpən","meaning":"v. （使）成熟","example":"The apples ripen in autumn.","translation":"苹果在秋天成熟。"},{"id":"动物学-118","cat":"动物学","word":"reproduction","ipa":"ˌriːprəˈdʌkʃ(ə)n","meaning":"n. 生殖；繁殖；复制；","example":"The reproduction of rabbits is very fast.","translation":"兔子的生殖速度很快。"},{"id":"动物学-119","cat":"动物学","word":"proliferate","ipa":"prəˈlɪfəreɪt","meaning":"v. 繁殖；","example":"Rabbits proliferate quickly in the wild.","translation":"兔子在野外繁殖得很快。"},{"id":"动物学-120","cat":"动物学","word":"speed","ipa":"spiːd","meaning":"n. 速度；速率；\nv. 加速；加快；","example":"The car's speed was too high on the wet road.","translation":"汽车在湿滑路面上的速度太快了。"},{"id":"动物学-121","cat":"动物学","word":"shortage","ipa":"ˈʃɔːtɪdʒ","meaning":"n. 不足；短缺；","example":"There is a shortage of clean water in the village.","translation":"这个村庄的清洁用水不足。"},{"id":"动物学-122","cat":"动物学","word":"bark","ipa":"bɑːk","meaning":"n. 树皮；\nv. 狗吠；","example":"The dog climbed the tree and touched the bark.","translation":"狗爬上了树，摸了摸树皮。"},{"id":"动物学-123","cat":"动物学","word":"sniff","ipa":"snɪf","meaning":"n. 闻；嗅；\nv. 闻；","example":"He gave a sniff of the flower.","translation":"他闻了闻那朵花。"},{"id":"动物学-124","cat":"动物学","word":"ashore","ipa":"əˈʃɔː(r)","meaning":"adv. 到岸上；在岸上；","example":"The sailors swam ashore after the boat sank.","translation":"船沉没后，水手们游到了岸上。"},{"id":"动物学-125","cat":"动物学","word":"migration","ipa":"maɪˈɡreɪʃ(ə)n","meaning":"n. 迁移；迁徙；转移；","example":"Birds begin migration in autumn.","translation":"鸟类在秋天开始迁徙。"},{"id":"动物学-126","cat":"动物学","word":"mass strandings","ipa":"/mæs ˈstrændɪŋz/","meaning":"phrase. 大规模搁浅（指大量海洋哺乳动物如鲸豚在同一时间、同一地点搁浅的现象）","example":"Whales have mass strandings on the beach.","translation":"鲸鱼会在海滩上集体搁浅。"},{"id":"动物学-127","cat":"动物学","word":"infest","ipa":"ɪnˈfest","meaning":"v. 大批出没于；成群滋扰；遍布于；寄生","example":"The bugs infest the old house.","translation":"这些虫子侵袭了这栋老房子。"},{"id":"动物学-128","cat":"动物学","word":"behavior","ipa":"bɪˈheɪvjə(r)","meaning":"n. 举止；表现；","example":"His behavior at the party was very polite.","translation":"他在派对上的举止非常礼貌。"},{"id":"动物学-129","cat":"动物学","word":"harmful","ipa":"ˈhɑːmf(ə)l","meaning":"adj. 有害的","example":"Smoking is harmful to your health.","translation":"吸烟对你的健康有害。"},{"id":"动物学-130","cat":"动物学","word":"toxin","ipa":"ˈtɒksɪn","meaning":"n. 毒素；毒质；","example":"The poison in the snake is a natural toxin.","translation":"蛇的毒液是一种天然毒素。"},{"id":"动物学-131","cat":"动物学","word":"parasite","ipa":"ˈpærəsaɪt","meaning":"n. 寄生虫；寄生生物；依赖他人过活者；","example":"The parasite lives inside the host's body.","translation":"这种寄生虫生活在宿主的体内。"},{"id":"动物学-132","cat":"动物学","word":"fatal","ipa":"ˈfeɪt(ə)l","meaning":"adj. 致命的；灾难性的；","example":"The accident was fatal.","translation":"那场事故是致命的。"},{"id":"动物学-133","cat":"动物学","word":"rarer","ipa":"ˈreər","meaning":"adj. 更稀罕的；更珍贵的；更珍贵的（rare 的比较级）；","example":"Gold is rarer than silver.","translation":"黄金比白银更稀罕。"},{"id":"动物学-134","cat":"动物学","word":"typical","ipa":"ˈtɪpɪk(ə)l","meaning":"adj. 典型的；有代表性的；","example":"This is a typical example of a sunny day.","translation":"这是一个晴天的典型例子。"},{"id":"动物学-135","cat":"动物学","word":"comprehensive","ipa":"ˌkɒmprɪˈhensɪv","meaning":"adj. 全面的；综合的；","example":"The teacher gave a comprehensive review before the exam.","translation":"老师在考试前给了一个全面的复习。"},{"id":"动物学-136","cat":"动物学","word":"detailed","ipa":"ˈdiːteɪld","meaning":"adj. 详细的；细致的； v. “detail”的过去式和过去分词；","example":"He gave a detailed description of the accident.","translation":"他对事故做了详细的描述。"},{"id":"动物学-137","cat":"动物学","word":"hibernation","ipa":"ˌhaɪbəˈneɪʃ(ə)n","meaning":"n. 冬眠","example":"Bears go into hibernation in winter.","translation":"熊在冬天冬眠。"},{"id":"动物学-138","cat":"动物学","word":"capture","ipa":"ˈkæptʃə(r)","meaning":"v. 记录；准确地描述；俘虏；吸引；\nn. 抓捕；","example":"The camera can capture the moment clearly.","translation":"相机可以清晰地记录下这一瞬间。"},{"id":"图书馆-2","cat":"图书馆","word":"variety","ipa":"vəˈraɪəti","meaning":"n. （同一事物）不同种类；多样性；（动植物的）品种；变化；","example":"The store sells a variety of apples.","translation":"这家商店出售各种各样的苹果。"},{"id":"图书馆-3","cat":"图书馆","word":"category","ipa":"ˈkætəɡəri","meaning":"n. 类别","example":"This book belongs to the science category.","translation":"这本书属于科学类别。"},{"id":"图书馆-4","cat":"图书馆","word":"card index","ipa":"ˈkɑːd ɪndeks","meaning":"phrase. 卡片索引","example":"He uses a card index to store phone numbers.","translation":"他用卡片索引来存储电话号码。"},{"id":"图书馆-5","cat":"图书馆","word":"pigeon hole sort","ipa":"ˈpɪdʒɪn həʊl sɔːt","meaning":"phrase. 鸽巢排序；一种利用有限范围整数键值将元素分配到“鸽巢”桶中再顺序收集的线性时间排序算法","example":"They use pigeon hole sort to arrange the numbers in order.","translation":"他们使用鸽巢排序来将数字按顺序排列。"},{"id":"图书馆-6","cat":"图书馆","word":"stack","ipa":"stæk","meaning":"n. 一摞；一叠；一堆；大烟囱；\nv. 把…放成整齐的一摞；","example":"He put the books in a stack on the table.","translation":"他把书堆成一摞放在桌子上。"},{"id":"图书馆-7","cat":"图书馆","word":"glossary","ipa":"ˈɡlɒsəri","meaning":"n. 术语汇编；词汇表","example":"He checked the glossary for the meaning of new words.","translation":"他查阅了术语表以了解新词的含义。"},{"id":"图书馆-8","cat":"图书馆","word":"librarianship","ipa":"ˌlaɪbrəˈnɛəʃɪp","meaning":"n. 图书馆事业；图书馆管理员职位；图书馆管理业务","example":"He wants to become a librarian and study librarianship.","translation":"他想成为一名图书管理员并学习图书管理学。"},{"id":"图书馆-9","cat":"图书馆","word":"Dewey Decimal Classification","ipa":"ˈdjuːi ˈdesɪməl ˌklæsɪfɪˈkeɪʃn","meaning":"phrase. 杜威十进制分类法，一种广泛用于图书馆的图书分类系统","example":"The library uses the Dewey decimal classification to organize books.","translation":"图书馆使用杜威十进制分类法来整理书籍。"},{"id":"图书馆-10","cat":"图书馆","word":"System","ipa":"ˈsɪstəm","meaning":"n. 系统；体系；","example":"The school has a new grading system.","translation":"学校有一个新的评分系统。"},{"id":"图书馆-11","cat":"图书馆","word":"press","ipa":"pres","meaning":"n. 新闻界；出版社；\nv. 按；压；","example":"The press reported the news quickly.","translation":"新闻界迅速报道了这则新闻。"},{"id":"图书馆-12","cat":"图书馆","word":"videotape","ipa":"ˈvɪdiəʊteɪp","meaning":"n. 录像带；\nv. 给…录像；","example":"He found an old videotape in the drawer.","translation":"他在抽屉里找到了一盘旧录像带。"},{"id":"图书馆-13","cat":"图书馆","word":"cassette recorder","ipa":"kəˈset rɪˈkɔːdə(r)","meaning":"phrase. 磁带录音机；盒式录音机","example":"He listens to music on a cassette recorder.","translation":"他用磁带录音机听音乐。"},{"id":"图书馆-14","cat":"图书馆","word":"newspaper","ipa":"ˈnjuːzpeɪpə(r)","meaning":"n. 报纸","example":"He reads the newspaper every morning.","translation":"他每天早上读报纸。"},{"id":"图书馆-15","cat":"图书馆","word":"magazine","ipa":"ˌmæɡəˈziːn","meaning":"n. 杂志","example":"He reads a magazine every evening.","translation":"他每天晚上读一本杂志。"},{"id":"图书馆-16","cat":"图书馆","word":"microform","ipa":"ˈmaɪkrəfɔːm","meaning":"n. 缩微过程; 缩微片; 微生物","example":"The library uses microform to save old newspapers.","translation":"图书馆使用缩微过程来保存旧报纸。"},{"id":"图书馆-17","cat":"图书馆","word":"publication","ipa":"ˌpʌblɪˈkeɪʃ(ə)n","meaning":"n. 出版；出版物；发表；","example":"The publication of his book was delayed.","translation":"他的书的出版被推迟了。"},{"id":"图书馆-18","cat":"图书馆","word":"classification","ipa":"ˌklæsɪfɪˈkeɪʃ(ə)n","meaning":"n. 分类；分级；","example":"The teacher gave a classification of animals into mammals and birds.","translation":"老师将动物分为哺乳动物和鸟类。"},{"id":"图书馆-19","cat":"图书馆","word":"volume","ipa":"ˈvɒljuːm","meaning":"n. 体积；卷；音量；","example":"The volume of the box is 10 cubic meters.","translation":"这个盒子的体积是10立方米。"},{"id":"图书馆-20","cat":"图书馆","word":"dictionary","ipa":"ˈdɪkʃənri","meaning":"n. 词典；字典；","example":"I looked up the word in a dictionary.","translation":"我在词典里查了这个词。"},{"id":"图书馆-21","cat":"图书馆","word":"journal","ipa":"ˈdʒɜːn(ə)l","meaning":"n. 期刊；日志；日记；","example":"He reads a science journal every week.","translation":"他每周读一本科学期刊。"},{"id":"图书馆-22","cat":"图书馆","word":"bound periodical","ipa":"/baʊnd ˌpɪəriˈɒdɪkəl/","meaning":"phrase. 装订成册的期刊；将多期杂志或期刊装订在一起的出版物","example":"He reads a bound periodical every week.","translation":"他每周读一本装订好的期刊。"},{"id":"图书馆-23","cat":"图书馆","word":"current","ipa":"ˈkʌrənt","meaning":"adj. 当前的；流通的；\nn. （水、气、电）流；趋势；","example":"The current weather is very hot.","translation":"当前的天气非常热。"},{"id":"图书馆-24","cat":"图书馆","word":"back issue","ipa":"/bæk ecks the almanac for the next full moon.","translation":"他查阅历书以查找下一个满月的日期。"},{"id":"图书馆-35","cat":"图书馆","word":"content","ipa":"ˈkɒntent","meaning":"n. 内容；含量；\nadj. 满足的；","example":"The content of the video is very interesting.","translation":"这个视频的内容非常有趣。"},{"id":"图书馆-36","cat":"图书馆","word":"handout","ipa":"ˈhændaʊt","meaning":"n. 讲义；","example":"The teacher gave us a handout about photosynthesis.","translation":"老师发给我们一份关于光合作用的讲义。"},{"id":"图书馆-37","cat":"图书馆","word":"leaflet","ipa":"ˈliːflət","meaning":"n. 传单；单页宣传品；","example":"He handed out a leaflet about the event.","translation":"他分发了一份关于该活动的传单。"},{"id":"图书馆-38","cat":"图书馆","word":"pamphlet","ipa":"ˈpæmflət","meaning":"n. 小册子","example":"He handed me a pamphlet about the new park.","translation":"他递给我一份关于新公园的小册子。"},{"id":"图书馆-39","cat":"图书馆","word":"booklet","ipa":"ˈbʊklət","meaning":"n. 小册子","example":"He read the booklet about the new rules.","translation":"他读了那本关于新规则的小册子。"},{"id":"图书馆-40","cat":"图书馆","word":"brochure","ipa":"ˈbrəʊʃə(r)","meaning":"n. 小册子；","example":"He picked up a brochure about the city.","translation":"他拿了一本关于这座城市的宣传小册子。"},{"id":"图书馆-41","cat":"图书馆","word":"library","ipa":"ˈlaɪbrəri","meaning":"n. 图书馆","example":"He goes to the library every afternoon.","translation":"他每天下午去图书馆。"},{"id":"图书馆-42","cat":"图书馆","word":"admission card","ipa":"ədˈmɪʃ(ə)n kɑːd","meaning":"phrase. 借书证；出入卡","example":"He showed his admission card to borrow a book.","translation":"他出示了他的借书证来借书。"},{"id":"图书馆-43","cat":"图书馆","word":"call slip","ipa":"kɔːl slɪp","meaning":"phrase. 借书证；借书单","example":"He wrote his name on the call slip.","translation":"他在借书单上写了名字。"},{"id":"图书馆-44","cat":"图书馆","word":"check out","ipa":"tʃek aʊt","meaning":"phrase. 付账后离开；核实","example":"We checked out of the hotel after paying the bill.","translation":"我们付完账后离开了酒店。"},{"id":"图书馆-45","cat":"图书馆","word":"renew","ipa":"rɪˈnjuː","meaning":"v. 更新；","example":"He will renew his passport next week.","translation":"他下周会更新他的护照。"},{"id":"图书馆-46","c 平。"},{"id":"学术-224","cat":"学术","word":"criteria","ipa":"kraɪˈtɪəriə","meaning":"n. 标准；尺度；准则；“criterion”的复数；","example":"The main criteria for selection are skill and experience.","translation":"选择的主要标准是技能和经验。"},{"id":"学术-225","cat":"学术","word":"comment","ipa":"ˈkɒment","meaning":"v. 评论；表达意见；\nn. 评论；意见；","example":"He commented on the movie last night.","translation":"他昨晚对这部电影发表了评论。"},{"id":"学术-226","cat":"学术","word":"dimension","ipa":"daɪˈmenʃ(ə)n","meaning":"n. 尺寸；维度；","example":"The dimension of the box is 10 cm by 5 cm.","translation":"这个盒子的尺寸是10厘米乘5厘米。"},{"id":"学术-227","cat":"学术","word":"trial basis","ipa":"ˈtraɪəl ˈbeɪsɪs","meaning":"phrase. 试用期；试验性基础","example":"He uses the app on a trial basis.","translation":"他以试用方式使用这个应用。"},{"id":"学术-228","cat":"学术","word":"attendance","ipa":"əˈtendəns","meaning":"n. 出席；","example":"His attendance at the meeting was mandatory.","translation":"他必须出席这次会议。"},{"id":"学术-229","cat":"学术","word":"participation","ipa":"pɑːˌtɪsɪˈpeɪʃ(ə)n","meaning":"n. 参与；参加；","example":"His participation in the meeting was very important.","translation":"他参与会议非常重要。"},{"id":"学术-230","cat":"学术","word":"quiz","ipa":"kwɪz","meaning":"n. 知识竞赛；","example":"The students participated in a history quiz at school.","translation":"学生们参加了学校举办的历史知识竞赛。"},{"id":"学术-231","cat":"学术","word":"dictation","ipa":"dɪkˈteɪʃ(ə)n","meaning":"n. 听写；口述；","example":"The teacher gave a dictation of five sentences.","translation":"老师进行了一次五句话的听写。"},{"id":"学术-232","cat":"学术","word":"objective","ipa":"əbˈdʒektɪv","meaning":"adj. 客观的；\nn. 目标；目的；","example":"He gave an objective opinion about the movie.","translation":"他对这部电影给出了一个客观的看法。"},{"id":"学术-233","cat":"学术","word":"subjective exam","ipa":"/səbˈdʒɛktɪv ɪɡˈzæm/","meaning":"phrase. 主观题考试；需要考生自行组织答案、体现个人观点或分析能力的考试形式","example":"He took a subjective exam last week.","translation":"他上周参加了一次主观性考试。"},{"id":"学术-234","cat":"学术","word":"final exam","ipa":"/ˈfaɪnəl ɪɡˈzæm/","meaning":"phrase. 期末考试；最终考试","example":"He is preparing for the final exam.","translation":"他正在为期末考试做准备。"},{"id":"学术-235","cat":"学术","word":"midterm test","ipa":"ˌmɪdˈtɜːm test","meaning":"phrase. 期中考试；学期中的测验","example":"He is preparing for the midterm test this week.","translation":"他这周正在为期中考试做准备。"},{"id":"学术-236","cat":"学术","word":"oral","ipa":"ˈɔːrəl","meaning":"adj. 口头的；口述的；","example":"He gave an oral report in class.","translation":"他在课堂上做了口头报告。"},{"id":"学术-237","cat":"学术","word":"written test","ipa":"/ˈrɪt(ə)n tɛst/","meaning":"phrase. 笔试；书面考试","example":"He passed the written test with high marks.","translation":"他以高分通过了笔试。"},{"id":"学术-238","cat":"学术","word":"placement test","ipa":"ˈpleɪsmənt test","meaning":"phrase. 分班考试","example":"He took a placement test to join the advanced class.","translation":"他参加了一次分班测试，以便进入高级班。"},{"id":"学术-239","cat":"学术","word":"score","ipa":"skɔː(r)","meaning":"n. 分数；得分；总谱；乐谱；\nv. 得分；","example":"He got a high score on the math test.","translation":"他在数学考试中得了高分。"},{"id":"学术-240","cat":"学术","word":"mark","ipa":"mɑːk","meaning":"n. 记号；分数；痕迹；\nv. 做标记；（使）留痕迹；评分；","example":"He put a mark on the map to show the place.","translation":"他在地图上做了一个记号来表示那个地方。"},{"id":"学术-241","cat":"学术","word":"credit","ipa":"ˈkredɪt","meaning":"n. 信用；赊账；赞扬；贷款；荣誉；\nv. 相信；","example":"He has good credit with the bank.","translation":"他在银行有良好的信用。"},{"id":"学术-242","cat":"学术","word":"scholarship","ipa":"ˈskɒləʃɪp","meaning":"n. 奖学金；","example":"He won a scholarship to study at Harvard.","translation":"他获得了一项去哈佛学习的奖学金。"},{"id":"学术-243","cat":"学术","word":"grant","ipa":"ɡrɑːnt","meaning":"n. 补助金；授予物；\nv. 承认；授予；允许；","example":"The university received a grant for scientific research.","translation":"这所大学收到了一笔用于科学研究的补助金。"},{"id":"学术-244","cat":"学术","word":"excellence","ipa":"ˈeksələns","meaning":"n. 卓越；","example":"He showed excellence in math competitions.","translation":"他在数学竞赛中表现出色。"},{"id":"学术-245","cat":"学术","word":"distinct","ipa":"dɪˈstɪŋkt","meaning":"adj. 有区别的；明显的；","example":"The two colors are distinct.","translation":"这两种颜色有区别。"},{"id":"学术-246","cat":"学术","word":"merit","ipa":"ˈmerɪt","meaning":"n. 优点；功绩；价值；","example":"The merit of this plan is its simplicity.","translation":"这个计划的优点是简单。"},{"id":"学术-247","cat":"学术","word":"pass","ipa":"pɑːs","meaning":"v. 通过；传递；路过；(时间)流逝；\nn. 通行证；(考试)及格；","example":"He passed the exam with a high score.","translation":"他以高分通过了考试。"},{"id":"学术-248","cat":"学术","word":"fail","ipa":"feɪl","meaning":"v. 无法做到；失败；不及格；倒闭；","example":"He failed to finish the race.","translation":"他没能完成比赛。"},{"id":"学术-249","cat":"学术","word":"cheating","ipa":"ˈtʃiːtɪŋ","meaning":"n. 欺骗；作弊； v. “cheat”的现在分词；","example":"Cheating on the test got him in trouble.","translation":"考试中的欺骗让他惹上了麻烦。"},{"id":"学术-250","cat":"学术","word":"plagiarism","ipa":"ˈpleɪdʒərɪzəm","meaning":"n. 剽窃；抄袭；","example":"He was punished for plagiarism in his essay.","translation":"他因论文剽窃而受到惩罚。"},{"id":"学术-251","cat":"学术","word":"copy","ipa":"ˈkɒpi","meaning":"n. 副本；(书，报纸等的) 一本；复制品；\nv. 复制；","example":"Please give me a copy of the report.","translation":"请给我一份报告的副本。"},{"id":"学术-252","cat":"学术","word":"resit","ipa":"ˌriːˈsɪt","meaning":"v. 重考；","example":"He will resit the math exam next month.","translation":"他下个月将重考数学考试。"},{"id":"学术-253","cat":"学术","word":"the expelled drop out","ipa":"ðə ɪkˈspelt drɒp aʊt","meaning":"phrase. 被开除的辍学者","example":"The expelled drop out found it hard to get a job.","translation":"被开除的辍学者发现很难找到工作。"},{"id":"学术-254","cat":"学术","word":"review","ipa":"rɪˈvjuː","meaning":"n. 回顾；复习；审查；评论；\nv. 回顾；复习；审核；评论；","example":"We had a quick review of last week's lesson.","translation":"我们对上周的课程做了一个简短的回顾。"},{"id":"学术-255","cat":"学术","word":"preview","ipa":"ˈpriːvjuː","meaning":"n. 预看；试映；","example":"He gave a quick preview of the movie.","translation":"他简要预看了这部电影。"},{"id":"学术-256","cat":"学术","word":"handout","ipa":"ˈhændaʊt","meaning":"n. 讲义；","example":"The teacher gave us a handout about photosynthesis.","translation":"老师发给我们一份关于光合作用的讲义。"},{"id":"学术-257","cat":"学术","word":"well-prepared","ipa":"ˌwɛl prɪˈpɛəd","meaning":"adj.做好充分准备; 准备良好的","example":"He is well-prepared for the exam.","translation":"他为考试做好了充分准备。"},{"id":"学术-258","cat":"学术","word":"investigation","ipa":"ɪnˌvestɪˈɡeɪʃ(ə)n","meaning":"n. 调查；研究；","example":"The police started an investigation into the accident.","translation":"警方对这起事故展开了调查。"},{"id":"学术-259","cat":"学术","word":"survey","ipa":"ˈsɜːveɪ","meaning":"n. 调查；勘测；\nv. 调查；勘测；","example":"The school did a survey about student lunch preferences.","translation":"学校做了一项关于学生午餐偏好的调查。"},{"id":"学术-260","cat":"学术","word":"research approach","ipa":"rɪˈsɜːtʃ əˈprəʊtʃ","meaning":"phrase. 研究方法","example":"His research approach is simple and clear.","translation":"他的研究方法简单而清晰。"},{"id":"学术-261","cat":"学术","word":"methods","ipa":"ˈmeθədz","meaning":"n. 方法；办法；“method”的复数；","example":"He uses simple methods to solve math problems.","translation":"他用简单的方法解决数学问题。"},{"id":"学术-262","cat":"学术","word":"methodology","ipa":"ˌmeθəˈdɒlədʒi","meaning":"n. 方法论；一套方法；","example":"The study uses a new methodology to collect data.","translation":"这项研究使用了一种新的方法论来收集数据。"},{"id":"学术-263","cat":"学术","word":"questionnaire","ipa":"ˌkwestʃəˈneə(r)","meaning":"n. 问卷；调查表；","example":"The teacher gave us a questionnaire about our habits.","translation":"老师给了我们一份关于我们习惯的问卷。"},{"id":"学术-264","cat":"学术","word":"observation","ipa":"ˌɒbzəˈveɪʃ(ə)n","meaning":"n. 观察；观测；注意；监视；(观察后的）意见；","example":"The scientist made an observation about the bird's behavior.","translation":"科学家对这只鸟的行为进行了观察。"},{"id":"学术-265","cat":"学术","word":"telephone survey","ipa":"ˈtelɪfəʊn ˈsɜːveɪ","meaning":"phrase. 电话调查","example":"They did a telephone survey last week.","translation":"他们上周进行了电话调查。"},{"id":"学术-266","cat":"学术","word":"face-to-face interviews","ipa":"feɪs tə feɪs ˈɪntəvjuːz","meaning":"phrase. 面对面的访谈；当面进行的面试或交谈","example":"The company holds face-to-face interviews for new employees.","translation":"公司为新员工举行面对面的面试。"},{"id":"学术-267","cat":"学术","word":"case study","ipa":"ˈkeɪs stʌdi","meaning":"phrase. 个案研究；案例分析；调查研究","example":"He did a case study on a small business.","translation":"他做了一个关于小企业的案例研究。"},{"id":"学术-268","cat":"学术","word":"postal survey","ipa":"/ˈpəʊstl sɜːˈveɪ/","meaning":"phrase. 邮寄调查；通过邮政方式发放的问卷调研","example":"They sent a postal survey to every household.","translation":"他们给每户家庭寄了一份邮寄调查问卷。"},{"id":"学术-269","cat":"学术","word":"poll","ipa":"pəʊl","meaning":"n. 民意调查；","example":"The poll showed that most people support the new law.","translation":"这项民意调查表明，大多数人支持这项新法律。"},{"id":"学术-270","cat":"学术","word":"respondents","ipa":"rɪsˈpɒndənts","meaning":"n. 被调查者；受访者；“respondent”的复数；","example":"The respondents answered the survey questions honestly.","translation":"被调查者诚实地回答了调查问题。"},{"id":"学术-271","cat":"学术","word":"interviewee","ipa":"ˌɪntəvjuːˈiː","meaning":"n. 被面试者；被采访者；","example":"The interviewee answered all the questions calmly.","translation":"被面试者冷静地回答了所有问题。"},{"id":"学术-272","cat":"学术","word":"participant","ipa":"pɑːˈtɪsɪpənt","meaning":"n. 参与者；参加者；","example":"Each participant must sign the form.","translation":"每个参与者都必须签署表格。"},{"id":"学术-273","cat":"学术","word":"opinion","ipa":"əˈpɪnjən","meaning":"n. 意见；看法；观点；","example":"He shared his opinion about the movie.","translation":"他分享了他对这部电影的意见。"},{"id":"学术-274","cat":"学术","word":"preference","ipa":"ˈprefrəns","meaning":"n. 偏好；","example":"He has a preference for tea over coffee.","translation":"他更喜欢茶而不是咖啡。"},{"id":"学术-275","cat":"学术","word":"drawbacks","ipa":"ˈdrɔːbæks","meaning":"n.缺点","example":"The drawbacks of this phone are high price and short battery.","translation":"这款手机的缺点是价格高和电池续航短。"},{"id":"学术-276","cat":"学术","word":"feedback","ipa":"ˈfiːdbæk","meaning":"n. 反馈","example":"The teacher gave me feedback on my essay.","translation":"老师给了我关于我作文的反馈。"},{"id":"学术-277","cat":"学术","word":"quantitative","ipa":"ˈkwɒntɪtətɪv","meaning":"adj. 定量的；","example":"The study uses quantitative data to measure results.","translation":"这项研究使用定量数据来测量结果。"},{"id":"学术-278","cat":"学术","word":"statistically valid","ipa ple":"The pump pressurise the water tank.","translation":"泵给水箱增压。"},{"id":"学术-412","cat":"学术","word":"depressurise","ipa":"/ˌdiːˈprɛʃəraɪz/","meaning":"v. 减压，降低压力","example":"The diver must depressurise slowly after diving.","translation":"潜水员潜水后必须缓慢减压。"},{"id":"学术-413","cat":"学术","word":"interior","ipa":"ɪnˈtɪəriə(r)","meaning":"n. 内部；\nadj. 内部的；","example":"The interior of the house is very cozy.","translation":"房子的内部非常舒适。"},{"id":"学术-414","cat":"学术","word":"exterior","ipa":"ɪkˈstɪəriə(r)","meaning":"n. 外观；外表；","example":"The exterior of the house is painted white.","translation":"这所房子的外观是白色的。"},{"id":"学术-415","cat":"学术","word":"replicate","ipa":"ˈreplɪkeɪt","meaning":"v. 复制；重复；","example":"The scientist tried to replicate the experiment.","translation":"这位科学家试图复制这个实验。"},{"id":"学术-416","cat":"学术","word":"recognition","ipa":"ˌrekəɡˈnɪʃ(ə)n","meaning":"n. 认可；识别；认识；承认；","example":"His hard work got recognition from his boss.","translation":"他的努力得到了老板的认可。"},{"id":"学术-417","cat":"学术","word":"boundary","ipa":"ˈbaʊnd(ə)ri","meaning":"n. 分界线；边界；","example":"The fence marks the boundary between the two gardens.","translation":"这道围栏标志着两个花园的分界线。"},{"id":"学术-418","cat":"学术","word":"Studies of Arts","ipa":"ˈstʌdiːz əv ɑːts","meaning":"phrase. 艺术研究；对艺术学科的学习与探讨","example":"He does studies of arts at the museum.","translation":"他在博物馆进行艺术研究。"},{"id":"学术-419","cat":"学术","word":"note-taking","ipa":"ˈnəʊttˈeɪkɪŋ","meaning":"n. 笔记","example":"He is good at note-taking in class.","translation":"他在课堂上很擅长做笔记。"},{"id":"学术-420","cat":"学术","word":"interfere","ipa":"ˌɪntəˈfɪə(r)","meaning":"v. 干扰；","example":"Don't interfere when I am working.","translation":"我工作时不要打扰。"},{"id":"学术-421","cat":"学术","word":"overlap","ipa":"ˌəʊvəˈlæp","meaning":"v. 交叠；使部分重叠；\nn. 重叠部分；","example":"The two colors overlap on the wall.","translation":"两种颜色在墙上交叠。"},{"id":"学术-422","cat":"学术","word":"slang","ipa":"slæŋ","meaning":"n. 俚语；行话；","example":"He uses a lot of slang when talking with friends.","translation":"他 season","ipa":"ˈsiːz(ə)n","meaning":"n. 季节；","example":"Spring is a beautiful season.","translation":"春天是一个美丽的季节。"},{"id":"学术-446","cat":"学术","word":"support","ipa":"səˈpɔːt","meaning":"v. 支持；支撑；\nn. 拥护；帮助；","example":"My friends support me when I feel sad.","translation":"当我感到难过时，我的朋友们支持我。"},{"id":"学术-447","cat":"学术","word":"mistake","ipa":"mɪˈsteɪk","meaning":"n. 错误；","example":"He made a mistake in his homework.","translation":"他在作业中犯了一个错误。"},{"id":"学术-448","cat":"学术","word":"simulation","ipa":"ˌsɪmjuˈleɪʃ(ə)n","meaning":"n. 模拟；仿真；","example":"The game uses a simulation of weather changes.","translation":"这个游戏使用了天气变化的模拟。"},{"id":"学术-449","cat":"学术","word":"translate","ipa":"trænzˈleɪt","meaning":"v. 转化；翻译；","example":"He can translate words into pictures.","translation":"他能把词语转化为图画。"},{"id":"学术-450","cat":"学术","word":"interface","ipa":"ˈɪntəfeɪs","meaning":"n. 界面；接口；","example":"The phone has a simple interface.","translation":"这部手机有一个简单的界面。"},{"id":"学术-451","cat":"学术","word":"involve","ipa":"ɪnˈvɒlv","meaning":"v. 包括；牵涉；","example":"The project involves simple math and writing.","translation":"这个项目包括简单的数学和写作。"},{"id":"学术-452","cat":"学术","word":"footprint","ipa":"ˈfʊtprɪnt","meaning":"n. 足迹；","example":"The bear left a footprint in the snow.","translation":"熊在雪地上留下了足迹。"},{"id":"学术-453","cat":"学术","word":"context","ipa":"ˈkɒntekst","meaning":"n. 上下文；语境；环境；","example":"The word means different things in different context.","translation":"这个词在不同的上下文中意思不同。"},{"id":"学术-454","cat":"学术","word":"mood","ipa":"muːd","meaning":"n. 心情；情绪；气氛；","example":"His mood changed after he heard the good news.","translation":"他听到这个好消息后，心情变了。"},{"id":"学术-455","cat":"学术","word":"purpose","ipa":"ˈpɜːpəs","meaning":"n. 目的；意图；","example":"His purpose is to help others.","translation":"他的目的是帮助别人。"},{"id":"学术-456","cat":"学术","word":"exclusive","ipa":"ɪkˈskluːsɪv","meaning":"adj. 独有的；排外的；","example":"This brand has an exclusive design.","translation":"这个品牌拥有独有的设计。"},{"id":"学术-457","cat":"学术","word":"participate","ipa":"pɑːˈtɪsɪpeɪt","meaning":"v. 参与；参加；","example":"He will participate in the school play.","translation":"他将参与学校的戏剧演出。"},{"id":"学术-458","cat":"学术","word":"representative","ipa":"reprɪˈzentətɪv","meaning":"n. 代表；典型事物；\nadj. 典型的；有代表性的；代议制的；","example":"He is the representative of our class.","translation":"他是我们班的代表。"},{"id":"学术-459","cat":"学术","word":"describe","ipa":"dɪˈskraɪb","meaning":"v. 描述","example":"He can describe the picture in one sentence.","translation":"他能用一句话描述这幅画。"},{"id":"学术-460","cat":"学术","word":"description","ipa":"dɪˈskrɪpʃ(ə)n","meaning":"n. 描述；形容；","example":"The teacher gave a clear description of the experiment.","translation":"老师对实验做了清晰的描述。"},{"id":"学术-461","cat":"学术","word":"commitment","ipa":"kəˈmɪtmənt","meaning":"n. 承诺；奉献；","example":"He made a commitment to finish the project on time.","translation":"他承诺按时完成这个项目。"},{"id":"学术-462","cat":"学术","word":"strategy","ipa":"ˈstrætədʒi","meaning":"n. 策略；战略；","example":"The team made a smart strategy to win the game.","translation":"这个团队制定了一项聪明的策略来赢得比赛。"},{"id":"学术-463","cat":"学术","word":"outcome","ipa":"ˈaʊtkʌm","meaning":"n. 结果；成果；","example":"The outcome of the game was a tie.","translation":"比赛的结果是平局。"},{"id":"学术-464","cat":"学术","word":"achievement","ipa":"əˈtʃiːvmənt","meaning":"n. 成就；成绩；完成；","example":"He felt proud of his academic achievement.","translation":"他为自己的学业成就感到自豪。"},{"id":"学术-465","cat":"学术","word":"sense","ipa":"sens","meaning":"n. 意义；感知；理解力；知觉；\nv. 感觉到；觉察出；意识到；","example":"The story has no sense.","translation":"这个故事没有意义。"},{"id":"学术-466","cat":"学术","word":"skim","ipa":"skɪm","meaning":"v. 掠过；略读；","example":"The stone skimmed over the water.","translation":"石头掠过水面。"},{"id":"学术-467","cat":"学术","word":"ignore","ipa":"ɪɡˈnɔː(r)","meaning":"v. 忽视；忽略；","example":"He ignored the warning sign.","translation":"他忽视了警告标志。"},{"id":"学术-468","cat":"学术","word":"convert into","ipa":"kənˈvɜːt ˈɪntuː","meaning":"phrase. 把...转变为","example":"He can convert water into ice by freezing it.","translation":"他可以通过冷冻把水变成冰。"},{"id":"学术-469","cat":"学术","word":"revert","ipa":"rɪˈvɜːt","meaning":"v. 恢复原状；","example":"He reverted to his old habits after the holiday.","translation":"假期后，他恢复了旧习惯。"},{"id":"学术-470","cat":"学术","word":"coordination","ipa":"kəʊˌɔːdɪˈneɪʃ(ə)n","meaning":"n. 协调；","example":"Good coordination between teams improves work efficiency.","translation":"团队之间的良好协调能提高工作效率。"},{"id":"学术-471","cat":"学术","word":"generalisation","ipa":"ˌdʒenrəlaɪˈzeɪʃ(ə)n","meaning":"n. 概括；概论；归纳","example":"He made a generalisation from the data.","translation":"他从数据中得出了一般性结论。"},{"id":"学术-472","cat":"学术","word":"issue","ipa":"ˈɪʃuː","meaning":"n. 问题；重要议题；发行（物）；\nv. 发行；","example":"The main issue is lack of money.","translation":"主要问题是缺乏资金。"},{"id":"学术-473","cat":"学术","word":"discipline","ipa":"ˈdɪsəplɪn","meaning":"n. 纪律；学科；科目；训练；惩戒；\nv. 约束自己；","example":"The teacher enforced discipline in the classroom.","translation":"老师在教室里维持纪律。"},{"id":"学术-474","cat":"学术","word":"cite","ipa":"saɪt","meaning":"v. 引用；提及；","example":"He cited a book in his essay.","translation":"他在文章中引用了一本书。"},{"id":"学术-475","cat":"学术","word":"sort","ipa":"sɔːt","meaning":"n. 种类；类别；\nv. 理清；解决；把…分类；拣选；","example":"This store sells all sorts of fruits.","translation":"这家商店出售各种各样的水果。"},{"id":"学术-476","cat":"学术","word":"aspect","ipa":"ˈæspekt","meaning":"n. 方面；","example":"One aspect of learning English is practicing speaking.","translation":"学习英语的一个方面是练习口语。"},{"id":"学术-477","cat":"学术","word":"sensation","ipa":"senˈseɪʃ(ə)n","meaning":"n. 感觉；知觉；轰动；","example":"The cold water gave her a sudden sensation.","translation":"冷水给了她一种突然的感觉。"},{"id":"学术-478","cat":"学术","word":"verdict","ipa":"ˈvɜːdɪkt","meaning":"n. 裁决；定论；","example":"The jury gave a guilty verdict.","translation":"陪审团作出了有罪裁决。"},{"id":"学术-479","cat":"学术","word":"factor","ipa":"ˈfæktə(r)","meaning":"n. 因素；要素；倍数；\nv. 把…因素包括进去；","example":"Weather is a factor in the game's outcome.","translation":"天气是比赛结果的一个因素。"},{"id":"学术-480","cat":"学术","word":"pretension","ipa":"prɪˈtenʃ(ə)n","meaning":"n. 自命不凡；自称；标榜；虚荣","example":"His pretension made others think he was better than them.","translation":"他的自命不凡让别人觉得他比他们强。"},{"id":"学术-481","cat":"学术","word":"prioritize","ipa":"praɪˈɒrətaɪz","meaning":"v. 给…排出先后顺序；","example":"We need to prioritize tasks by their deadlines.","translation":"我们需要根据截止日期给任务排出先后顺序。"},{"id":"学术-482","cat":"学术","word":"decoy","ipa":"ˈdiːkɔɪ","meaning":"n. 诱饵；（诱捕鸟兽的）动物\nv. 引诱","example":"The hunter used a decoy to attract ducks.","translation":"猎人用假鸭子来吸引鸭子。"},{"id":"学术-483","cat":"学术","word":"trick","ipa":"trɪk","meaning":"n. 诀窍；诡计；","example":"He showed me the trick to solve this math problem quickly.","translation":"他给我展示了快速解决这道数学题的诀窍。"},{"id":"学术-484","cat":"学术","word":"modification","ipa":"ˌmɒdɪfɪˈkeɪʃ(ə)n","meaning":"n. 修改；变更；改进；","example":"The modification improved the design.","translation":"这个修改改进了设计。"},{"id":"学术-485","cat":"学术","word":"astray","ipa":"əˈstreɪ","meaning":"adv. 迷路地；误入歧途地\nadj. 迷路的；误入歧途的","example":"The little dog went astray in the park.","translation":"那只小狗在公园里走丢了。"},{"id":"学术-486","cat":"学术","word":"overcome","ipa":"ˌəʊvəˈkʌm","meaning":"v. 克服；战胜；","example":"He overcame his fear of speaking in public.","translation":"他克服了当众演讲的恐惧。"},{"id":"学术-487","cat":"学术","word":"initiative","ipa":"ɪˈnɪʃətɪv","meaning":"n. 倡议；主动权；自发性；措施；","example":"The school launched an initiative to reduce plastic use.","translation":"学校发起了一项减少塑料使用的倡议。"},{"id":"学术-488","cat":"学术","word":"proportion","ipa":"prəˈpɔːʃ(ə)n","meaning":"n. 比例；份额；","example":"The proportion of students who passed the test was high.","translation":"通过考试的学生比例很高。"},{"id":"学术-489","cat":"学术","word":"trail","ipa":"treɪl","meaning":"n. 小径；路径；踪迹；\nv. 跟踪；尾随；落后于；","example":"We walked along a trail in the forest.","translation":"我们沿着森林里的一条小径走着。"},{"id":"学术-490","cat":"学术","word":"follow-up","ipa":"ˈfɒləʊ ʌp","meaning":"n. 后续工作；后续事物\nadj. 后续的；接着的","example":"He made a follow-up call to check on his patient.","translation":"他打了一个随访电话来检查病人的状况。"},{"id":"学术-491","cat":"学术","word":"indicate","ipa":"ˈɪndɪkeɪt","meaning":"v. 表明；指示；","example":"The dark clouds indicate rain.","translation":"乌云表明要下雨了。"},{"id":"学术-492","cat":"学术","word":"exaggerate","ipa":"ɪɡˈzædʒəreɪt","meaning":"v. 夸张；夸大；","example":"He exaggerates his achievements to impress others.","translation":"他夸张自己的成就来给别人留下印象。"},{"id":"学术-493","cat":"学术","word":"seek","ipa":"siːk","meaning":"v. 寻求；寻找；","example":"He seeks help when he is stuck.","translation":"当他遇到困难时，他会寻求帮助。"},{"id":"学术-494","cat":"学术","word":"branches","ipa":"ˈbrɑːntʃɪz","meaning":"n. 树枝；分支；分公司；分支；“branch”的复数；","example":"The wind blew down the branches of the tree.","translation":"风把树的树枝吹落了。"},{"id":"学术-495","cat":"学术","word":"tension","ipa":"ˈtenʃ(ə)n","meaning":"n. 紧张；紧张局势；紧张关系；","example":"There was tension between the two friends after the argument.","translation":"两人争吵后，彼此之间出现了紧张。"},{"id":"学术-496","cat":"学术","word":"claim","ipa":"kleɪm","meaning":"v. 声称；索赔；\nn. 声称；索要；","example":"He claims that he saw a UFO last night.","translation":"他声称自己昨晚看到了不明飞行物。"},{"id":"学术-497","cat":"学术","word":"devote","ipa":"dɪˈvəʊt","meaning":"v. 投入；","example":"He devotes his time to helping children.","translation":"他投入时间帮助孩子们。"},{"id":"学术-498","cat":"学术","word":"relief","ipa":"rɪˈliːf","meaning":"n. 减缓；宽慰；解脱；救济；","example":"The medicine brought relief to his pain.","translation":"这种药缓解了他的疼痛。"},{"id":"学术-499","cat":"学术","word":"satisfaction","ipa":"ˌsætɪsˈfækʃ(ə)n","meaning":"n. 满意；满足；","example":"He felt satisfaction after finishing his homework.","translation":"他完成作业后感到满意。"},{"id":"学术-500","cat":"学术","word":"colloquialism","ipa":"kəˈləʊkwiəlɪzəm","meaning":"n. 白话；俗语；口语","example":"He used a colloquialism when he said 'gonna' instead of 'going to'.","translation":"他说'gonna'而不是'going to'时，使用了一个口语词。"},{"id":"学术-501","cat":"学术","word":"epic","ipa":"ˈepɪk","meaning":"adj. 史诗的；叙事诗的；宏丽的；","example":"The movie tells an epic story of heroes and dragons.","translation":"这部电影讲述了一个关于英雄和龙的史诗故事。"},{"id":"学术-502","cat":"学术","word":"authority","ipa":"ɔːˈθɒrəti","meaning":"n. 权威；官方机构；权力；权威人士；当局；","example":"The teacher is an authority on ancient history.","translation":"这位老师是古代史方面的权威。"},{"id":"学术-503","cat":"学术","word":"affirmation","ipa":"ˌæfəˈmeɪʃ(ə)n","meaning":"n. 肯定；确认；证实","example":"He gave her a loud affirmation.","translation":"他给了她一个大声的肯定。"},{"id":"学术-504","cat":"学术","word":"principle","ipa":"ˈprɪnsəp(ə)l","meaning":"n. 原则；原理；","example":"He always follows the principle of honesty.","translation":"他总是遵循诚实的原则。"},{"id":"学术-505","cat":"学术","word":"mental","ipa":"ˈment(ə)l","meaning":"adj. 心理的；精神的；","example":"He has a mental illness.","translation":"他有心理疾病。"},{"id":"学术-506","cat":"学术","word":"intact","ipa":"ɪnˈtækt","meaning":"adj. 完整无缺的；","example":"The vase remained intact after the fall.","translation":"花瓶从高处摔下后依然完整无缺。"},{"id":"学术-507","cat":"学术","word":"massive","ipa":"ˈmæsɪv","meaning":"adj. 大规模的；大而重的；","example":"The company launched a massive advertising campaign.","translation":"这家公司发起了一场大规模的广告活动。"},{"id":"学术-508","cat":"学术","word":"alternatives","ipa":"ɔːlˈtɜːnətɪvz","meaning":"n. 替代选择；替代选择（alternative 的复数）；","example":"We need to find better alternatives to plastic.","translation":"我们需要找到比塑料更好的替代选择。"},{"id":"学术-509","cat":"学术","word":"appalling","ipa":"əˈpɔːlɪŋ","meaning":"adj. 骇人的； v. “appall”的现在分词；","example":"The accident caused an appalling sight.","translation":"这场事故造成了一幅骇人的景象。"},{"id":"学术-510","cat":"学术","word":"damp","ipa":"dæmp","meaning":"adj. 潮湿的；","example":"The ground is damp after the rain.","translation":"雨后地面是潮湿的。"},{"id":"学术-511","cat":"学术","word":"upwards","ipa":"ˈʌpwədz","meaning":"adv. 向上；向高处；","example":"The balloon moved upwards slowly.","translation":"气球慢慢地向上飘。"},{"id":"学术-512","cat":"学术","word":"shiny","ipa":"ˈʃaɪni","meaning":"adj. 光亮的；闪耀的；锃亮的；有光泽的；","example":"The shiny coin caught her eye.","translation":"那枚光亮的硬币引起了她的注意。"},{"id":"学术-513","cat":"学术","word":"promising","ipa":"ˈprɒmɪsɪŋ","meaning":"adj. 有希望的；有前途的； v. 承诺；答应；“promise”的现在分词；","example":"The young boy is a promising student.","translation":"这个小男孩是个有希望的学生。"},{"id":"学术-514","cat":"学术","word":"rival","ipa":"ˈraɪv(ə)l","meaning":"n. 竞争者；敌手；\nv. 竞争；相匹敌；","example":"He is my main rival in the race.","translation":"他是我在比赛中主要的竞争者。"},{"id":"学术-515","cat":"学术","word":"permanent","ipa":"ˈpɜːmənənt","meaning":"adj. 永久的；持久的；","example":"He made a permanent change to his lifestyle.","translation":"他对自己的生活方式做出了永久的改变。"},{"id":"学术-516","cat":"学术","word":"ample","ipa":"ˈæmp(ə)l","meaning":"adj. 足够的；","example":"There is ample food for everyone.","translation":"每个人都有足够的食物。"},{"id":"学术-517","cat":"学术","word":"steady","ipa":"ˈstedi","meaning":"adj. 稳定的；\nv. 使稳住；","example":"The boat moved in a steady way on the calm sea.","translation":"船在平静的海面上平稳地移动。"},{"id":"学术-518","cat":"学术","word":"vulnerable","ipa":"ˈvʌlnərəb(ə)l","meaning":"adj. 易受伤的；脆弱的；","example":"Children are vulnerable to colds in winter.","translation":"儿童在冬天容易感冒。"},{"id":"学术-519","cat":"学术","word":"contentious","ipa":"kənˈtenʃəs","meaning":"adj. 好争吵的；有争议的","example":"The plan is contentious because many people disagree.","translation":"这个计划有争议，因为很多人不同意。"},{"id":"学术-520","cat":"学术","word":"conical","ipa":"ˈkɒnɪk(ə)l","meaning":"adj. 圆锥形的；圆锥的","example":"The ice cream is in a conical cup.","translation":"冰淇淋装在一个圆锥形的杯子里。"},{"id":"学术-521","cat":"学术","word":"definite","ipa":"ˈdefɪnət","meaning":"adj. 肯定的；确定的；","example":"He gave a definite answer to the question.","translation":"他对这个问题给出了肯定的答案。"},{"id":"学术-522","cat":"学术","word":"straightforward","ipa":"ˌstreɪtˈfɔːwəd","meaning":"adj. 简单的；","example":"The instructions were straightforward and easy to follow.","translation":"这些说明很简单，容易遵循。"},{"id":"学术-523","cat":"学术","word":"pale","ipa":"peɪl","meaning":"adj. （颜色）淡的；苍白的；","example":"The sky turned pale blue at dawn.","translation":"黎明时，天空变成了淡蓝色。"},{"id":"学术-524","cat":"学术","word":"eligible","ipa":"ˈelɪdʒəb(ə)l","meaning":"adj. 有资格的；合格的；合意的；","example":"He is eligible to vote because he is 18 years old.","translation":"他年满18岁，有资格投票。"},{"id":"学术-525","cat":"学术","word":"voluntary","ipa":"ˈvɒləntri","meaning":"adj. 自愿的；志愿的；","example":"He did voluntary work at the hospital.","translation":"他在医院做志愿工作。"},{"id":"学术-526","cat":"学术","word":"optical","ipa":"ˈɒptɪk(ə)l","meaning":"adj. 光学的；","example":"He uses optical lenses to see small objects.","translation":"他使用光学镜片来看小物体。"},{"id":"学术-527","cat":"学术","word":"confidential","ipa":"ˌkɒnfɪˈdenʃ(ə)l","meaning":"adj. 机密的；秘密的；","example":"The document is confidential and cannot be shared.","translation":"这份文件是机密的，不能分享。"},{"id":"学术-528","cat":"学术","word":"critical","ipa":"ˈkrɪtɪk(ə)l","meaning":"adj. 至关重要的；批判性的；关键的；危急的；临界的；","example":"Water is critical for life.","translation":"水对生命至关重要。"},{"id":"学术-529","cat":"学术","word":"dynamic","ipa":"daɪˈnæmɪk","meaning":"adj. 动态的；有活力的；不断变化的；\nn. 活力；动力；","example":"The game has dynamic weather that changes every hour.","translation":"这个游戏有每小时变化的动态天气。"},{"id":"学术-530","cat":"学术","word":"reciprocal","ipa":"rɪˈsɪprək(ə)l","meaning":"adj. 互惠的；","example":"They have a reciprocal agreement to help each other.","translation":"他们有一个互相帮助的互惠协议。"},{"id":"学术-531","cat":"学术","word":"innovative","ipa":"ˈɪnəveɪtɪv","meaning":"adj. 革新的；富有革新精神的；","example":"The company made an innovative phone.","translation":"这家公司推出了一款革新的手机。"},{"id":"学术-532","cat":"学术","word":"frustrated","ipa":"frʌˈstreɪtɪd","meaning":"adj. 失意的；挫败的； v. “frustrate”的过去式和过去分词；","example":"He felt frustrated when he failed the test.","translation":"当他考试不及格时，他感到失意。"},{"id":"学术-533","cat":"学术","word":"tricky","ipa":"ˈtrɪki","meaning":"adj. 棘手的；狡猾的；","example":"This puzzle is tricky for kids.","translation":"这个谜题对孩子来说很棘手。"},{"id":"学术-534","cat":"学术","word":"identical","ipa":"aɪˈdentɪk(ə)l","meaning":"adj. 相同的；同样的；","example":"The two shirts are identical.","translation":"这两件衬衫是一样的。"},{"id":"学术-535","cat":"学术","word":"novel","ipa":"ˈnɒv(ə)l","meaning":"n. （长篇）小说；\nadj. 新颖的；新奇的；","example":"He wrote a novel about a brave girl.","translation":"他写了一部关于一个勇敢女孩的小说。"},{"id":"学术-536","cat":"学术","word":"terrific","ipa":"təˈrɪfɪk","meaning":"adj. 极好的；","example":"The movie was terrific, so we all enjoyed it.","translation":"这部电影极好，所以我们都很喜欢。"},{"id":"学术-537","cat":"学术","word":"harsh","ipa":"hɑːʃ","meaning":"adj. 严酷的；严厉的；","example":"The desert has a harsh climate.","translation":"沙漠的气候非常严酷。"},{"id":"学术-538","cat":"学术","word":"radical","ipa":"ˈrædɪk(ə)l","meaning":"adj. 根本的；彻底的；激进的；","example":"The government made radical changes to the education system.","translation":"政府对教育系统进行了根本性的改革。"},{"id":"学术-539","cat":"学术","word":"mysterious","ipa":"mɪˈstɪəriəs","meaning":"adj. 神秘的","example":"The mysterious box appeared on his doorstep.","translation":"那个神秘的盒子出现在他的门口。"},{"id":"学术-540","cat":"学术","word":"potential","ipa":"pəˈtenʃ(ə)l","meaning":"n. 潜力；\nadj. 潜在的；","example":"The young athlete shows great potential.","translation":"这位年轻运动员展现出巨大的潜力。"},{"id":"学术-541","cat":"学术","word":"predominant","ipa":"prɪˈdɒmɪnənt","meaning":"adj. 主导的；主要的；","example":"The predominant color in the room is blue.","translation":"房间里的主导颜色是蓝色。"},{"id":"学术-542","cat":"学术","word":"consultative","ipa":"kənˈsʌltətɪv","meaning":"adj. 咨询的；","example":"The committee is consultative and gives advice.","translation":"这个委员会是咨询性的，提供意见。"},{"id":"学术-543","cat":"学术","word":"collaborative","ipa":"kəˈlæbərətɪv","meaning":"adj. 合作的；协力的；","example":"They did a collaborative project in class.","translation":"他们在课堂上做了一个合作项目。"},{"id":"学术-544","cat":"学术","word":"situational","ipa":"ˌsɪtʃuˈeɪʃən(ə)l","meaning":"adj. 情景的","example":"He gave a situational answer to the question.","translation":"他对这个问题给出了一个情境相关的回答。"},{"id":"学术-545","cat":"学术","word":"Social Affairs","ipa":"ˈsəʊʃl əˈfeəz","meaning":"phrase. 社会事务；社会问题相关的事宜","example":"He cares about social affairs in his community.","translation":"他关心自己社区的社会事务。"},{"id":"学术-546","cat":"学术","word":"sponsor","ipa":"ˈspɒnsə(r)","meaning":"n. 赞助商；\nv. 赞助；","example":"The company is a sponsor of the football match.","translation":"这家公司是这场足球赛的赞助商。"},{"id":"学术-547","cat":"学术","word":"dropout","ipa":"ˈdrɒp aʊt","meaning":"n. 辍学者；退学的人；被淘汰者","example":"He became a drop-out after grade 10.","translation":"他在十年级后辍学了。"},{"id":"学术-548","cat":"学术","word":"childcare","ipa":"ˈtʃaɪldkeə(r)","meaning":"n. 儿童托管；儿童保育；","example":"She works in childcare for young children.","translation":"她从事幼儿托管工作。"},{"id":"学术-549","cat":"学术","word":"childmind","ipa":"tʃaɪldmaɪnd","meaning":"v. 照看孩子","example":"She childminds three children every afternoon.","translation":"她每天下午照看三个孩子。"},{"id":"学术-550","cat":"学术","word":"babysit","ipa":"ˈbeɪbisɪt","meaning":"v. 替人临时照看（小孩）","example":"She babysits her neighbor's child every Friday.","translation":"她每周五帮邻居照看孩子。"},{"id":"学术-551","cat":"学术","word":"toddler","ipa":"ˈtɒdlə(r)","meaning":"n. 学步的儿童","example":"The toddler is walking slowly by the sofa.","translation":"这个幼儿正慢慢地在沙发旁走路。"},{"id":"学术-552","cat":"学术","word":"niggle","ipa":"ˈnɪɡl","meaning":"n. 小牢骚；","example":"He made a niggle about the coffee being too hot.","translation":"他抱怨咖啡太烫了。"},{"id":"学术-553","cat":"学术","word":"prize","ipa":"praɪz","meaning":"n. 奖赏；奖品；奖金；\nv. 珍视；","example":"He won a prize for the best science project.","translation":"他因最好的科学项目获得了奖赏。"},{"id":"学术-554","cat":"学术","word":"award","ipa":"əˈwɔːd","meaning":"n. 奖品；裁定；\nv. 授予；","example":"He received an award for best student.","translation":"他获得了最佳学生奖。"},{"id":"学术-555","cat":"学术","word":"reward","ipa":"rɪˈwɔːd","meaning":"n. 奖励；报酬；\nv. 奖励；回报；","example":"He got a reward for winning the contest.","translation":"他因赢得比赛而得到了奖励。"},{"id":"学术-556","cat":"学术","word":"punishment","ipa":"ˈpʌnɪʃmənt","meaning":"n. 处罚；惩罚；","example":"The boy got punishment for breaking the window.","translation":"这个男孩因为打碎了窗户而受到了处罚。"},{"id":"学术-557","cat":"学术","word":"warn","ipa":"wɔːn","meaning":"v. 警告；告诫；提醒注意；","example":"The teacher warned the students not to be late.","translation":"老师警告学生不要迟到。"},{"id":"学术-558","cat":"学术","word":"accident","ipa":"ˈæksɪd(ə)nt","meaning":"n. 事故；意外事件；意外；","example":"He was hurt in a car accident.","translation":"他在一场车祸中受伤了。"},{"id":"学术-559","cat":"学术","word":"avoidance","ipa":"əˈvɔɪdəns","meaning":"n. 避免","example":"He showed avoidance of difficult math problems.","translation":"他回避困难的数学问题。"},{"id":"学术-560","cat":"学术","word":"barrier","ipa":"ˈbæriə(r)","meaning":"n. 障碍；屏障；栅栏；","example":"The fence is a barrier to animals.","translation":"这道围栏是动物的障碍。"},{"id":"学术-561","cat":"学术","word":"leg room","ipa":"ˈleɡruːm","meaning":"n. 座位前放腿处","example":"This car has enough leg-room for tall people.","translation":"这辆车有足够腿部空间给高个子的人。"},{"id":"学术-562","cat":"学术","word":"backstage","ipa":"ˌbækˈsteɪdʒ","meaning":"n. 后台；\nadv. 在后台；","example":"The actors waited backstage before the show.","translation":"演员们在演出前在后台等候。"},{"id":"学术-563","cat":"学术","word":"lifecycle","ipa":"ˈlaɪfˌsaɪkl","meaning":"n. 生活周期；生活过程；生命循环；","example":"The lifecycle of a butterfly has four stages.","translation":"蝴蝶的生活周期有四个阶段。"},{"id":"学术-564","cat":"学术","word":"interact","ipa":"ˌɪntərˈækt","meaning":"v. 互相作用；互相影响；交流；沟通；","example":"The two chemicals interact when mixed.","translation":"这两种化学物质混合时会互相作用。"},{"id":"学术-565","cat":"学术","word":"Manipulation","ipa":"məˌnɪpjuˈleɪʃ(ə)n","meaning":"n. 操纵；操作；处理；","example":"The politician used manipulation to win the election.","translation":"这位政治家通过操纵赢得了选举。"},{"id":"学术-566","cat":"学术","word":"glaze","ipa":"ɡleɪz","meaning":"v. 上釉；上玻璃；浇浆汁于；变呆滞\nn. 釉料；光滑面；覆罩的一层","example":"The potter glazes the clay bowl before firing it.","translation":"陶匠在烧制前给陶碗上釉。"},{"id":"学术-567","cat":"学术","word":"sew","ipa":"səʊ","meaning":"v. 缝制；缝补；","example":"She sews a dress for her daughter.","translation":"她为女儿缝制一件连衣裙。"},{"id":"学术-568","cat":"学术","word":"decline","ipa":"dɪˈklaɪn","meaning":"n. 下降；衰退；\nv. 下降；衰退；","example":"There was a sharp decline in sales last month.","translation":"上个月销售额大幅下降。"},{"id":"学术-569","cat":"学术","word":"trap","ipa":"træp","meaning":"v. 陷入（困境）；设圈套；\nn. 圈套；陷阱；困境；","example":"He trapped himself in debt by spending too much.","translation":"他因花钱太多而陷入债务困境。"},{"id":"学术-570","cat":"学术","word":"stick","ipa":"stɪk","meaning":"v. 粘附；（随意）放置；忍受；\nn. 棍枝；条状物；球棍；","example":"The glue makes the paper stick to the table.","translation":"胶水使纸粘在桌子上。"},{"id":"学术-571","cat":"学术","word":"detach","ipa":"dɪˈtætʃ","meaning":"v. 脱离；拆卸；分离；","example":"He tried to detach himself from the group.","translation":"他试图脱离这个群体。"},{"id":"学术-572","cat":"学术","word":"attributable","ipa":"əˈtrɪbjətəb(ə)l","meaning":"adj. 可归因于…的；","example":"The accident is attributable to poor road conditions.","translation":"这起事故可归因于糟糕的路况。"},{"id":"学术-573","cat":"学术","word":"navigate","ipa":"ˈnævɪɡeɪt","meaning":"v. 导航；应付（复杂情况）；","example":"He uses a map to navigate the city.","translation":"他用地图来导航这座城市。"},{"id":"学术-574","cat":"学术","word":"reveal","ipa":"rɪˈviːl","meaning":"v. 揭露；泄露；显露；","example":"The letter revealed his secret.","translation":"这封信揭露了他的秘密。"},{"id":"学术-575","cat":"学术","word":"spread","ipa":"spred","meaning":"v. 传播；扩散；散布；\nn. 传播；蔓延；范围；","example":"The virus spread quickly through the city.","translation":"病毒在城市中迅速传播。"},{"id":"学术-576","cat":"学术","word":"distinguish","ipa":"dɪˈstɪŋɡwɪʃ","meaning":"v. 使有别于；区分；","example":"The two colors distinguish the two teams.","translation":"这两种颜色使两个队伍有所不同。"},{"id":"学术-577","cat":"学术","word":"relocate","ipa":"ˌriːləʊˈkeɪt","meaning":"v. 重新安置；","example":"They decided to relocate to a quieter town.","translation":"他们决定搬到一个更安静的城镇。"},{"id":"学术-578","cat":"学术","word":"laminate","ipa":"ˈlæmɪnət","meaning":"v. 用薄片覆盖；压成薄片；","example":"They laminate the table with plastic to make it waterproof.","translation":"他们用塑料薄片覆盖桌子，使其防水。"},{"id":"学术-579","cat":"学术","word":"maintenance","ipa":"ˈmeɪntənəns","meaning":"n. 维持；维修；保养；","example":"The cost of maintenance is low for this car.","translation":"这辆车的维持费用很低。"},{"id":"学术-580","cat":"学术","word":"efficiency","ipa":"ɪˈfɪʃ(ə)nsi","meaning":"n. 效率；","example":"The new machine improves the efficiency of production.","translation":"这台新机器提高了生产的效率。"},{"id":"学术-581","cat":"学术","word":"initiate","ipa":"ɪˈnɪʃieɪt","meaning":"v. 发起；开始实施；","example":"He will initiate a new project next week.","translation":"他将在下周发起一个新项目。"},{"id":"学术-582","cat":"学术","word":"fulfill","ipa":"fʊlˈfɪl","meaning":"v. 实现；","example":"He worked hard to fulfill his dream.","translation":"他努力工作以实现自己的梦想。"},{"id":"学术-583","cat":"学术","word":"organism","ipa":"ˈɔːɡənɪzəm","meaning":"n. 生物体；有机体；有机组织；","example":"A bacterium is a simple organism.","translation":"细菌是一种简单的生物体。"},{"id":"学术-584","cat":"学术","word":"impose","ipa":"ɪmˈpəʊz","meaning":"v. 强加；强制实施；","example":"The government imposed a new tax on sugar.","translation":"政府对糖征收了一项新税。"},{"id":"学术-585","cat":"学术","word":"discern","ipa":"dɪˈsɜːn","meaning":"v. 辨明；","example":"He could discern a small bird in the trees.","translation":"他能辨明树上有一只小鸟。"},{"id":"工作-2","cat":"工作","word":"job","ipa":"dʒɒb","meaning":"n. 工作","example":"He got a new job last week.","translation":"他上周找到了一份新工作。"},{"id":"工作-3","cat":"工作","word":"career","ipa":"kəˈrɪə(r)","meaning":"n. 事业；生涯；","example":"He built a successful career in medicine.","translation":"他在医学领域建立了成功的事业。"},{"id":"工作-4","cat":"工作","word":"occupation","ipa":"ˌɒkjuˈpeɪʃ(ə)n","meaning":"n. 占领；职业；占有；","example":"The occupation of the city by foreign troops lasted for years.","translation":"外国军队对这座城市的占领持续了多年。"},{"id":"工作-5","cat":"工作","word":"vocation","ipa":"vəʊˈkeɪʃ(ə)n","meaning":"n. 职业；行业；使命","example":"He chose teaching as his vocation.","translation":"他选择了教学作为自己的职业。"},{"id":"工作-6","cat":"工作","word":"profession","ipa":"prəˈfeʃ(ə)n","meaning":"n. 职业；专业；","example":"His profession is a teacher.","translation":"他的职业是教师。"},{"id":"工作-7","cat":"工作","word":"interviewer","ipa":"ˈɪntəvjuːə(r)","meaning":"n. 采访者；面试官；","example":"The interviewer asked him about his work experience.","translation":"采访者问他关于他的工作经验。"},{"id":"工作-8","cat":"工作","word":"personnel manager","ipa":"ˌpɜːsəˈnel ˈmænɪdʒə(r)","meaning":"phrase. 人事经理；人事主管","example":"The personnel manager hires new workers.","translation":"人事经理招聘新员工。"},{"id":"工作-9","cat":"工作","word":"human resource","ipa":"ˈhjuːmən rɪˈsɔːs","meaning":"phrase. 人力资源（指企业或组织中的员工及其管理）","example":"The company hired a new manager for its human resource department.","translation":"公司为人力资源部门聘请了一位新经理。"},{"id":"工作-10","cat":"工作","word":"interviewee","ipa":"ˌɪntəvjuːˈiː","meaning":"n. 被面试者；被采访者；","example":"The interviewee answered all the questions calmly.","translation":"被面试者冷静地回答了所有问题。"},{"id":"工作-11","cat":"工作","word":"applicant","ipa":"ˈæplɪkənt","meaning":"n. 申请人","example":"The applicant filled out the form carefully.","translation":"这位申请人仔细填写了表格。"},{"id":"工作-12","cat":"工作","word":"candidate","ipa":"ˈkændɪdət","meaning":"n. 候选人；应试者；","example":"He is a candidate for the mayor position.","translation":"他是市长职位的候选人。"},{"id":"工作-13","cat":"工作","word":"employer","ipa":"ɪmˈplɔɪə(r)","meaning":"n. 雇主","example":"The employer gave her a raise.","translation":"雇主给她加了薪。"},{"id":"工作-14","cat":"工作","word":"employee","ipa":"ɪmˈplɔɪiː","meaning":"n. 雇员；受雇者；","example":"The employee arrived at work early.","translation":"这位雇员早早到达了工作地点。"},{"id":"工作-15","cat":"工作","word":"self-employed","ipa":"ˌself ɪmˈplɔɪd","meaning":"adj. 自己经营的；个体经营的；非受雇于人的","example":"He is self-employed and works from home.","translation":"他是自由职业者，在家工作。"},{"id":"工作-16","cat":"工作","word":"delegate","ipa":"ˈdelɪɡeɪt","meaning":"v. 委派；","example":"The manager will delegate the task to her assistant.","translation":"经理将把这个任务委派给她的助手。"},{"id":"工作-17","cat":"工作","word":"allocate","ipa":"ˈæləkeɪt","meaning":"v. 分配；","example":"The teacher will allocate books to students.","translation":"老师将给学生分配书籍。"},{"id":"工作-18","cat":"工作","word":"job hunting","ipa":"ˈdʒɒb hʌntɪŋ","meaning":"n. 求职; v. 求职（job-hunt 的 ing 形式）","example":"He is job-hunting after graduation.","translation":"他毕业后正在找工作。"},{"id":"工作-19","cat":"工作","word":"job seeking","ipa":"ˈdʒɒb ˌsiːkɪŋ","meaning":"n.求职","example":"He is job-seeking after graduation.","translation":"他毕业后正在找工作。"},{"id":"工作-20","cat":"工作","word":"recruit","ipa":"rɪˈkruːt","meaning":"v. 招聘；","example":"The company plans to recruit new staff next month.","translation":"这家公司计划下个月招聘新员工。"},{"id":"工作-21","cat":"工作","word":"job fair","ipa":"dʒɒb feə(r)","meaning":"phrase. 招聘会","example":"He went to a job fair to find work.","translation":"他去参加招聘会找工作。"},{"id":"工作-22","cat":"工作","word":"personnel market","ipa":"pɜːsəˈnel ˈmɑːkɪt","meaning":"phrase. 人才市场；人力资源市场","example":"He is looking for a job in the personnel market.","translation":"他正在人才市场上找工作。"},{"id":"工作-23","cat":"工作","word":"apply for a job","ipa":"əˈplaɪ fɔːr ə dʒɒb","meaning":"短语动词. 申请一份工作","example":"He wants to apply for a job at the store.","translation":"他想申请商店里的一份工作。"},{"id":"工作-24","cat":"工作","word":"position","ipa":"pəˈzɪʃ(ə)n","meaning":"n. 位置；职位；地位；姿势；","example":"The book is on the table in a good position.","translation":"书放在桌子上的一个好位置。"},{"id":"工作-25","cat":"工作","word":"vacant positions","ipa":"ˈveɪkənt pəˈzɪʃnz","meaning":"phrase. 空缺职位；空置岗位","example":"The company has five vacant positions.","translation":"这家公司有五个空缺职位。"},{"id":"工作-26","cat":"工作","word":"appointment","ipa":"əˈpɔɪntmənt","meaning":"n. 约会；约定；任命；","example":"I have an appointment with my doctor at 3 p.m.","translation":"我下午三点有个医生的约会。"},{"id":"工作-27","cat":"工作","word":"application letter","ipa":"ˌæplɪˈkeɪʃn ˈletə","meaning":"phrase. 求职信；申请信（用于申请工作、学校等场合的正式信件）","example":"He wrote an application letter for the job.","translation":"他写了一封求职信。"},{"id":"工作-28","cat":"工作","word":"resume","ipa":"rɪˈzjuːm","meaning":"v. （中断后）继续； n.梗概，摘要（résumé或resumé）；<美>简历，履历（résumé或resumé）","example":"After the break, we will resume the meeting.","translation":"休息后，我们将继续开会。"},{"id":"工作-29","cat":"工作","word":"cv","ipa":"ˌsiː ˈviː","meaning":"abbr. 简历；履历；“curriculum vitae”的缩写","example":"He sent his cv to the company.","translation":"他把简历发给了公司。"},{"id":"工作-30","cat":"工作","word":"letter of reference","ipa":"ˈletə əv ˈrefrəns","meaning":"phrase. 推荐信","exampl ","example":"The two balls made contact when they collided.","translation":"两个球在碰撞时发生了接触。"},{"id":"工作-43","cat":"工作","word":"letterbox","ipa":"ˈletəbɒks","meaning":"n. 邮箱；信箱；邮筒","example":"He put the letter in the letterbox.","translation":"他把信放进信箱里。"},{"id":"工作-44","cat":"工作","word":"referee","ipa":"ˌrefəˈriː","meaning":"n. 裁判；介绍人；仲裁者","example":"The referee blew the whistle for a foul.","translation":"裁判吹哨判罚犯规。"},{"id":"工作-45","cat":"工作","word":"emergency contact","ipa":"ɪˈmɜːdʒənsi ˈkɒntækt","meaning":"phrase. 紧急联系人","example":"He wrote his emergency contact on the form.","translation":"他在表格上写了紧急联系人。"},{"id":"工作-46","cat":"工作","word":"university attended","ipa":"ˌjuːnɪˈvɜːsəti əˈtendɪd","meaning":"phrase. & v. 就读的大学；曾入读的高等院校","example":"He attended Harvard University.","translation":"他就读于哈佛大学。"},{"id":"工作-47","cat":"工作","word":"college","ipa":"ˈkɒlɪdʒ","meaning":"n. 学院；大学；","example":"He works at a small college.","translation":"他在一所小型学院工作。"},{"id":"工作-48","cat":"工作","word":"high school","ipa":"ˈhaɪ skuːl","meaning":"phrase. 高中","example":"He plays basketball in high school.","translation":"他在高中打篮球。"},{"id":"工作-49","cat":"工作","word":"secondary school","ipa":"ˈsekəndri skuːl","meaning":"phrase. 中学","example":"He teaches math in a secondary school.","translation":"他在一所中学教数学。"},{"id":"工作-50","cat":"工作","word":"major","ipa":"ˈmeɪdʒə(r)","meaning":"adj. 主要的；\nn. 大调；主修课；","example":"Math is a major subject in school.","translation":"数学是学校里的主要科目。"},{"id":"工作-51","cat":"工作","word":"cloud","ipa":"klaʊd","meaning":"n. 云朵；云层；","example":"The cloud floats high in the sky.","translation":"云朵在天空中飘浮。"},{"id":"工作-52","cat":"工作","word":"programming","ipa":"ˈprəʊɡræmɪŋ","meaning":"n. 编程； v. “programme”的现在分词；","example":"He loves programming in his free time.","translation":"他喜欢在空闲时间编程。"},{"id":"工作-53","cat":"工作","word":"accounting","ipa":"əˈkaʊntɪŋ","meaning":"v. 解释说明；“account”的现在分词； n. 会计；会计学；","example":"He is accounting for his absence.","translation":"他正在解释他的缺席。"},{"id":"工作-54","cat":"工作","word":"finance","ipa":"ˈfaɪnæns","meaning":"n. 金融；财务；\nv. 提供资金；","example":"He works in finance in New York.","translation":"他在纽约从事金融工作。"},{"id":"工作-55","cat":"工作","word":"sociology","ipa":"ˌsəʊsiˈɒlədʒi","meaning":"n. 社会学","example":"He is taking sociology at university.","translation":"他在大学里学习社会学。"},{"id":"工作-56","cat":"工作","word":"medicine","ipa":"ˈmedɪs(ə)n","meaning":"n. 医学；药；","example":"He wants to study medicine at university.","translation":"他想在大学学习医学。"},{"id":"工作-57","cat":"工作","word":"law","ipa":"lɔː","meaning":"n. 法律；定律；","example":"He broke the law and was arrested.","translation":"他违反了法律，被逮捕了。"},{"id":"工作-58","cat":"工作","word":"philosophy","ipa":"fəˈlɒsəfi","meaning":"n. 哲学","example":"He likes to study philosophy in his free time.","translation":"他喜欢在空闲时间学习哲学。"},{"id":"工作-59","cat":"工作","word":"civil engineering","ipa":"ˌsɪv(ə)l endʒɪˈnɪərɪŋ","meaning":"phrase. 土木工程","example":"He is studying civil engineering at university.","translation":"他正在大学学习土木工程。"},{"id":"工作-60","cat":"工作","word":"tourism and hospitality","ipa":"ˈtʊərɪzəm ənd ˌhɒspɪˈtæləti","meaning":"phrase. 旅游业与接待服务业","example":"Tourism and hospitality create many jobs in small towns.","translation":"旅游业和酒店业在小镇上创造了许多工作。"},{"id":"工作-61","cat":"工作","word":"management","ipa":"ˈmænɪdʒmənt","meaning":"n. 管理；","example":"Good management helps a company grow.","translation":"良好的管理有助于公司发展。"},{"id":"工作-62","cat":"工作","word":"social and public policy","ipa":"/ˈsəʊʃl ənd ˈpʌblɪk ˈpɒləsi/","meaning":"phrase. 社会与公共政策","example":"The government is changing social and public policy to help poor families.","translation":"政府正在改变社会和公共政策以帮助贫困家庭。"},{"id":"工作-63","cat":"工作","word":"subject","ipa":"ˈsʌbdʒɪkt","meaning":"n. 主题；学科；对象；\nv. 使臣服；\nadj. 易遭受…的；受…支配的；","example":"The subject of the book is ancient history.","translation":"这本书的主题是古代历史。"},{"id":"工作-64","cat":"工作","word":"English","ipa":"ˈɪŋɡlɪʃ","meaning":"n. 英语；英文；\nadj. 英格兰的；英格兰人的；英语的；","example":"He speaks English every day.","translation":"他每天说英语。"},{"id":"工作-65","cat":"工作","word":"Mathematics","ipa":"ˌmæθəˈmætɪks","meaning":"n. 数学","example":"He loves mathematics because it is logical.","translation":"他喜欢数学，因为它有逻辑性。"},{"id":"工作-66","cat":"工作","word":"History","ipa":"ˈhɪstri","meaning":"n. 历史；历史学；","example":"He likes to read history books about ancient Rome.","translation":"他喜欢阅读关于古罗马的历史书籍。"},{"id":"工作-67","cat":"工作","word":"Physics","ipa":"ˈfɪzɪks","meaning":"n. 物理学","example":"He likes to study physics in school.","translation":"他喜欢在学校学习物理。"},{"id":"工作-68","cat":"工作","word":"Chemistry","ipa":"ˈkemɪstri","meaning":"n. 化学","example":"He likes chemistry because it is fun.","translation":"他喜欢化学，因为它很有趣。"},{"id":"工作-69","cat":"工作","word":"Politics","ipa":"ˈpɒlətɪks","meaning":"n. 政治；政治学；","example":"He is interested in politics.","translation":"他对政治感兴趣。"},{"id":"工作-70","cat":"工作","word":"Biology","ipa":"baɪˈɒlədʒi","meaning":"n. 生物学","example":"He likes biology because it teaches about animals and plants.","translation":"他喜欢生物学，因为它教关于动物和植物的知识。"},{"id":"工作-71","cat":"工作","word":"Ecology","ipa":"iˈkɒlədʒi","meaning":"n. 生态学；生态；","example":"He studies ecology to understand how animals live with plants.","translation":"他学习生态学以了解动物如何与植物共存。"},{"id":"工作-72","cat":"工作","word":"Geography","ipa":"dʒiˈɒɡrəfi","meaning":"n. 地理学；地理；","example":"He loves geography and learns about countries and rivers.","translation":"他喜欢地理学，学习各国和河流的知识。"},{"id":"工作-73","cat":"工作","word":"course","ipa":"kɔːs","meaning":"n. 过程；课程；一道菜；","example":"The course of the river changed after the flood.","translation":"河流的流程在洪水后发生了变化。"},{"id":"工作-74","cat":"工作","word":"degree","ipa":"dɪˈɡriː","meaning":"n. 度；程度；学位；","example":"The temperature is 30 degrees today.","translation":"今天气温是30度。"},{"id":"工作-75","cat":"工作","word":"bachelor","ipa":"ˈbætʃələ(r)","meaning":"n. 学士（本科）；","example":"He earned a bachelor in computer science.","translation":"他获得了计算机科学学士学位。"},{"id":"工作-76","cat":"工作","word":"master","ipa":"ˈmɑːstə(r)","meaning":"n. 大师；主人；\nv. 掌
