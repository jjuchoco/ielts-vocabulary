se. 生态平衡","example":"The forest keeps the ecological balance.","translation":"森林维持着生态平衡。"},{"id":"环境-4","cat":"环境","word":"balance of nature","ipa":"ˈbæləns əv ˈneɪtʃə(r)","meaning":"phrase. 自然界的平衡；生态平衡","example":"People must protect the balance of nature.","translation":"人们必须保护自然的平衡。"},{"id":"环境-5","cat":"环境","word":"food chain","ipa":"ˈfuːd tʃeɪn","meaning":"phrase. 食物链","example":"The lion is at the top of the food chain.","translation":"狮子处于食物链的顶端。"},{"id":"环境-6","cat":"环境","word":"environmental protection","ipa":"ɪnˌvaɪrənˈment(ə)l prəˈtekʃ(ə)n","meaning":"phrase. 环境保护","example":"He works for environmental protection.","translation":"他从事环境保护工作。"},{"id":"环境-7","cat":"环境","word":"environmental pollution","ipa":"ɪnˌvaɪrənˈment(ə)l pəˈluːʃ(ə)n","meaning":"phrase. 环境污染","example":"The river is dirty because of environmental pollution.","translation":"由于环境污染，这条河变得很脏。"},{"id":"环境-8","cat":"环境","word":"environmental issue","ipa":"ɪnˌvaɪrənˈment(ə)l ˈɪʃuː","meaning":"phrase. 环境问题","example":"This town has a serious environmental issue with dirty water.","translation":"这个小镇有严重的水质污染问题。"},{"id":"环境-9","cat":"环境","word":"greenhouse effect","ipa":"ˈɡriːnhaʊs ɪfekt","meaning":"phrase. 温室效应","example":"The greenhouse effect makes the Earth warmer.","translation":"温室效应使地球变暖。"},{"id":"环境-10","cat":"环境","word":"global warming","ipa":"ˌɡləʊb(ə)l ˈwɔːmɪŋ","meaning":"phrase. 全球变暖","example":"Global warming is making the Earth hotter.","translation":"全球变暖正在让地球变得更热。"},{"id":"环境-11","cat":"环境","word":"meteorology","ipa":"ˌmiːtiəˈrɒlədʒi","meaning":"n. 气象学","example":"He works in meteorology and predicts the weather.","translation":"他从事气象学工作，预测天气。"},{"id":"环境-12","cat":"环境","word":"rainfall","ipa":"ˈreɪnfɔːl","meaning":"n. 降雨量；","example":"Last month's rainfall was very low.","translation":"上个月的降雨量非常少。"},{"id":"环境-13","cat":"环境","word":"ecosystem","ipa":"ˈiːkəʊsɪstəm","meaning":"n. 生态系统","example":"The forest is a healthy ecosystem.","translation":"这片森林是一个健康的生态系统。"},{"id":"环境-14","cat":"环境","word":"preservation","ipa":"ˌprezəˈveɪʃ(ə)n","meaning":"n. 保存；维持；","example":"The museum focuses on the preservation of old books.","translation":"博物馆专注于旧书的保存。"},{"id":"环境-15","cat":"环境","word":"conserve","ipa":"kənˈsɜːv","meaning":"v. 节约；保护；","example":"We should conserve water in daily life.","translation":"我们应在日常生活中节约用水。"},{"id":"环境-16","cat":"环境","word":"conservation","ipa":"ˌkɒnsəˈveɪʃ(ə)n","meaning":"n. 保护；节约（自然资源）；","example":"The park is for the conservation of wild animals.","translation":"这个公园是为了保护野生动物。"},{"id":"环境-17","cat":"环境","word":"deteriorate","ipa":"dɪˈtɪəriəreɪt","meaning":"v. 恶化；变坏；退化；","example":"The weather will deteriorate tomorrow.","translation":"明天天气会恶化。"},{"id":"环境-18","cat":"环境","word":"threat","ipa":"θret","meaning":"n. 威胁；","example":"The storm is a threat to the village.","translation":"这场风暴对村庄构成了威胁。"},{"id":"环境-19","cat":"环境","word":"extinction","ipa":"ɪkˈstɪŋkʃ(ə)n","meaning":"n. 灭绝；消亡；","example":"The extinction of dinosaurs happened millions of years ago.","translation":"恐龙的灭绝发生在数百万年前。"},{"id":"环境-20","cat":"环境","word":"contamination","ipa":"kənˌtæmɪˈneɪʃ(ə)n","meaning":"n. 污染；","example":"The river suffered from contamination after the factory dumped waste.","translation":"工厂倾倒废物后，这条河受到了污染。"},{"id":"环境-21","cat":"环境","word":"pollution index","ipa":"pəˈluːʃn ˈɪndeks","meaning":"phrase. 污染指数；用于衡量空气、水或土壤等环境中污染物浓度的数值指标","example":"The pollution index is high today.","translation":"今天的污染指数很高。"},{"id":"环境-22","cat":"环境","word":"pollutant","ipa":"pəˈluːtənt","meaning":"n. 污染物","example":"The factory releases a pollutant into the river.","translation":"工厂向河里排放一种污染物。"},{"id":"环境-23","cat":"环境","word":"reflectance rate","ipa":"/rɪˈflektəns reɪt/","meaning":"phrase. 反射率；反射比；表面反射光线的比率","example":"The reflectance rate of the mirror is very high.","translation":"镜子的反射率非常高。"},{"id":"环境-24","cat":"环境","word":"public awareness campaign","ipa":"ˈpʌblɪk əˈweənəs kæmˈpeɪn","meaning":"phrase. 公众意识宣传活动；旨在提高大众对某一问题认知的宣传运动","example":"The government launched a public awareness campaign about recycling.","translation":"政府发起了一项关于回收利用的公众意识运动。"},{"id":"环境-25","cat":"环境","word":"habitat","ipa":"ˈhæbɪtæt","meaning":"n. 栖息地；居留地；产地；","example":"The panda's habitat is in the mountains of China.","translation":"熊猫的栖息地在中国的山区。"},{"id":"环境-26","cat":"环境","word":"contentious","ipa":"kənˈtenʃəs","meaning":"adj. 好争吵的；有争议的","example":"The plan is contentious because many people disagree.","translation":"这个计划有争议，因为很多人不同意。"},{"id":"环境-27","cat":"环境","word":"prioritize","ipa":"praɪˈɒrətaɪz","meaning":"v. 给…排出先后顺序；","example":"We need to prioritize tasks by their deadlines.","translation":"我们需要根据截止日期给任务排出先后顺序。"},{"id":"环境-28","cat":"环境","word":"availability","ipa":"əˌveɪləˈbɪləti","meaning":"n. 可用性；可获得性；","example":"The availability of free Wi-Fi is important for travelers.","translation":"免费Wi-Fi的可用性对旅行者很重要。"},{"id":"环境-29","cat":"环境","word":"energy-efficient","ipa":"ˈenədʒiː ɪfˈɪʃ(ə)nt","meaning":"adj. 节能的；高能效的","example":"This house uses energy-efficient lights.","translation":"这所房子使用节能灯。"},{"id":"环境-30","cat":"环境","word":"electricity surplus","ipa":"/ɪˌlɛkˈtrɪsɪti ˈsɜːpləs/","meaning":"phrase. 电力过剩；电能盈余","example":"The country has an electricity surplus this year.","translation":"今年这个国家电力有剩余。"},{"id":"环境-31","cat":"环境","word":"firewood","ipa":"ˈfaɪəwʊd","meaning":"n. 木柴；柴火；","example":"He collected firewood for the campfire.","translation":"他为篝火收集了木柴。"},{"id":"环境-32","cat":"环境","word":"coal","ipa":"kəʊl","meaning":"n. 煤","example":"He burns coal to keep his house warm.","translation":"他烧煤来让房子暖和。"},{"id":"环境-33","cat":"环境","word":"charcoal","ipa":"ˈtʃɑːkəʊl","meaning":"n. 木炭","example":"He drew a picture with charcoal.","translation":"他用木炭画了一幅画。"},{"id":"环境-34","cat":"环境","word":"natural gas","ipa":"ˌnætʃrəl ˈɡæs","meaning":"phrase. 天然气","example":"He uses natural gas to cook dinner.","translation":"他用天然气做饭。"},{"id":"环境-35","cat":"环境","word":"oil","ipa":"ɔɪl","meaning":"n. 油；石油；","example":"She put oil on the pan before cooking.","translation":"她在锅里倒了油再做饭。"},{"id":"环境-36","cat":"环境","word":"petroleum","ipa":"pəˈtrəʊliəm","meaning":"n. 石油","example":"The car runs on petroleum.","translation":"这辆车使用石油运行。"},{"id":"环境-37","cat":"环境","word":"petrol","ipa":"ˈpetrəl","meaning":"n. 汽油","example":"He buys petrol every Friday.","translation":"他每周五买汽油。"},{"id":"环境-38","cat":"环境","word":"fossil fuels","ipa":"ˈfɒsəl fjuːəlz","meaning":"phrase. 化石燃料（如煤、石油和天然气）","example":"Cars use fossil fuels to move.","translation":"汽车使用化石燃料来行驶。"},{"id":"环境-39","cat":"环境","word":"tide","ipa":"taɪd","meaning":"n. 潮汐；潮流；","example":"The tide comes in every twelve hours.","translation":"潮汐每十二小时涨一次。"},{"id":"环境-40","cat":"环境","word":"hydro-electric power","ipa":"ˈhaɪdrəʊ ɪˈlektrɪk ˈpaʊə(r)","meaning":"phrase. 水力发电","example":"The dam produces hydro-electric power for the town.","translation":"大坝为这个城镇提供水力发电。"},{"id":"环境-41","cat":"环境","word":"nuclear plant","ipa":"ˈnjuː.kliə ˈplɑːnt","meaning":"phrase. 核电站；核能发电厂","example":"The nuclear plant provides electricity for the city.","translation":"核电站为这座城市提供电力。"},{"id":"环境-42","cat":"环境","word":"nuclear test","ipa":"ˈnjuːkliə test","meaning":"phrase. 核试验","example":"The country did a nuclear test last year.","translation":"这个国家去年进行了一次核试验。"},{"id":"环境-43","cat":"环境","word":"wind power","ipa":"wɪnd ˈpaʊə(r)","meaning":"phrase. 风力；风能（利用风力发电的能源形式）","example":"The village uses wind power to make electricity.","translation":"这个村庄使用风能来发电。"},{"id":"环境-44","cat":"环境","word":"water power","ipa":"ˈwɔːtə paʊə(r)","meaning":"phrase. 水力","example":"The village uses water power to make electricity.","translation":"这个村庄用水力发电。"},{"id":"环境-45","cat":"环境","word":"solar energy","ipa":"ˌsəʊlər ˈenədʒi","meaning":"phrase. 太阳能","example":"The house uses solar energy to power the lights.","translation":"这所房子利用太阳能来供电。"},{"id":"环境-46","cat":"环境","word":"alternative energy","ipa":"ɔːlˌtɜːnətɪv ˈenədʒi","meaning":"phrase. 替代能源","example":"We use solar panels to get alternative energy.","translation":"我 ,"translation":"大气使地球保持温暖。"},{"id":"环境-58","cat":"环境","word":"particulate","ipa":"pəˈtɪkjuleɪt","meaning":"adj. 粒子状的；微粒的\nn. 粒子；微粒状物质","example":"The air contains particulate matter from smoke.","translation":"空气中含有来自烟雾的粒子状物质。"},{"id":"环境-59","cat":"环境","word":"oxygen","ipa":"ˈɒksɪdʒən","meaning":"n. 氧气；","example":"Plants release oxygen into the air.","translation":"植物向空气中释放氧气。"},{"id":"环境-60","cat":"环境","word":"ozone layer","ipa":"ˈəʊzəʊn leɪə(r)","meaning":"phrase. 臭氧层","example":"The ozone layer protects us from the sun's harmful rays.","translation":"臭氧层保护我们免受太阳有害射线的伤害。"},{"id":"环境-61","cat":"环境","word":"glacier","ipa":"ˈɡlæsiə(r)","meaning":"n. 冰川；冰河；","example":"The glacier moves slowly down the mountain.","translation":"冰川缓慢地沿着山向下移动。"},{"id":"环境-62","cat":"环境","word":"ocean current","ipa":"ˈəʊʃ(ə)n ˈkʌrənt","meaning":"phrase. 洋流","example":"The ocean current moves slowly across the sea.","translation":"洋流在海中缓慢流动。"},{"id":"环境-63","cat":"环境","word":"plastic","ipa":"ˈplæstɪk","meaning":"n. 塑料；\nadj. 塑料的；","example":"The bottle is made of plastic.","translation":"这个瓶子是塑料做的。"},{"id":"环境-64","cat":"环境","word":"surface","ipa":"ˈsɜːfɪs","meaning":"n. 表面；\nv. 显露；","example":"The surface of the table is smooth.","translation":"桌子的表面很光滑。"},{"id":"环境-65","cat":"环境","word":"leak","ipa":"liːk","meaning":"n. 漏洞；泄露；\nv. 漏；泄露；","example":"The leak in the roof caused water to drip inside.","translation":"屋顶的漏洞导致水滴进屋里。"},{"id":"环境-66","cat":"环境","word":"discard","ipa":"dɪˈskɑːd","meaning":"v. 抛开；废弃；","example":"He decided to discard his old habits.","translation":"他决定抛开旧习惯。"},{"id":"环境-67","cat":"环境","word":"release","ipa":"rɪˈliːs","meaning":"n. 释放；发布；\nv. 释放；发布；","example":"The release of the prisoner made everyone happy.","translation":"囚犯的释放让每个人都高兴。"},{"id":"环境-68","cat":"环境","word":"garbage","ipa":"ˈɡɑːbɪdʒ","meaning":"n. 垃圾；废物；","example":"The children threw garbage on the floor.","translation":"孩子们把垃圾扔在地上。"},{"id":"环境-69","cat":"环境","word":"waste disposal","ipa":"weɪst ","ipa":"ˈpɔɪzənəs","meaning":"adj. 有毒的","example":"The frog is poisonous.","translation":"这只青蛙是有毒的。"},{"id":"环境-81","cat":"环境","word":"venomous","ipa":"ˈvenəməs","meaning":"adj. 分泌毒液的；有毒的；恶毒的","example":"The snake is venomous.","translation":"这条蛇是有毒的。"},{"id":"环境-82","cat":"环境","word":"fumes","ipa":"fjuːmz","meaning":"n. 烟雾；烟气；“fume”的复数； v. 大为生气；","example":"The car released black fumes from its exhaust.","translation":"汽车从排气管冒出黑烟。"},{"id":"环境-83","cat":"环境","word":"sewage","ipa":"ˈsuːɪdʒ","meaning":"n. 污水；污物；下水道；","example":"The city cleaned the sewage from the streets.","translation":"城市清理了街道上的污水。"},{"id":"环境-84","cat":"环境","word":"water treatment plant","ipa":"ˈwɔːtə ˌtriːtmənt plɑːnt","meaning":"phrase. 水处理厂；用于净化或处理污水及饮用水的设施","example":"The water treatment plant cleans dirty water.","translation":"水处理厂净化脏水。"},{"id":"环境-85","cat":"环境","word":"biodegradable","ipa":"ˌbaɪəʊdɪˈɡreɪdəb(ə)l","meaning":"adj. 可生物降解的","example":"The bag is biodegradable.","translation":"这个袋子是可生物降解的。"},{"id":"环境-86","cat":"环境","word":"harness","ipa":"ˈhɑːnɪs","meaning":"v. 利用；\nn. 马具；","example":"We must harness the power of the sun.","translation":"我们必须利用太阳的能量。"},{"id":"环境-87","cat":"环境","word":"phenomenon","ipa":"fəˈnɒmɪnən","meaning":"n. 现象；","example":"The rainbow is a natural phenomenon.","translation":"彩虹是一种自然现象。"},{"id":"环境-88","cat":"环境","word":"deterioration","ipa":"dɪˌtɪəriəˈreɪʃ(ə)n","meaning":"n. 恶化；变质；","example":"The deterioration of the road made driving dangerous.","translation":"道路的恶化使驾驶变得危险。"},{"id":"环境-89","cat":"环境","word":"radiation","ipa":"ˌreɪdiˈeɪʃ(ə)n","meaning":"n. 辐射；","example":"The sun gives off radiation.","translation":"太阳发出辐射。"},{"id":"环境-90","cat":"环境","word":"Acid rain","ipa":"ˌæsɪd ˈreɪn","meaning":"phrase. 酸雨","example":"Acid rain kills trees and fish.","translation":"酸雨杀死树木和鱼类。"},{"id":"环境-91","cat":"环境","word":"smog","ipa":"smɒɡ","meaning":"n. 烟雾","example":"The city has heavy smog in winter.","translation":"这个城市冬天有严重的雾霾。"},{"id":"环境-92","cat":"环境","w le.","translation":"对环境的破坏是不可逆转的。"},{"id":"环境-127","cat":"环境","word":"recurrent","ipa":"rɪˈkʌrənt","meaning":"adj. 反复出现的；再发生的；","example":"He has recurrent headaches every week.","translation":"他每周都反复出现头痛。"},{"id":"环境-128","cat":"环境","word":"reclaim","ipa":"rɪˈkleɪm","meaning":"v. 要求归还；收回；开垦；感化","example":"He wants to reclaim his lost wallet.","translation":"他想要要求归还他丢失的钱包。"},{"id":"环境-129","cat":"环境","word":"contemporary","ipa":"kənˈtemprəri","meaning":"adj. 现代的；当代的；同时代的；","example":"This museum displays contemporary art.","translation":"这个博物馆展示现代艺术。"},{"id":"环境-130","cat":"环境","word":"crystal","ipa":"ˈkrɪst(ə)l","meaning":"n. 水晶；结晶；","example":"She wears a necklace made of crystal.","translation":"她戴一条水晶制成的项链。"},{"id":"环境-131","cat":"环境","word":"salt","ipa":"sɔːlt","meaning":"n. 盐；食盐；","example":"She added a little salt to the soup.","translation":"她在汤里加了一点盐。"},{"id":"环境-132","cat":"环境","word":"stone quarry","ipa":"stəʊn ˈkwɒri","meaning":"phrase. 采石场；开采石材的地方","example":"They work at a stone quarry near the mountain.","translation":"他们在山边的一个采石场工作。"},{"id":"环境-133","cat":"环境","word":"productive","ipa":"prəˈdʌktɪv","meaning":"adj. 富有成效的；多产的；生产的；","example":"He had a productive day and finished all his work.","translation":"他度过了富有成效的一天，完成了所有工作。"},{"id":"环境-134","cat":"环境","word":"sloping","ipa":"ˈsləʊpɪŋ","meaning":"adj. 倾斜的；有坡度的； v. “slope”的现在分词；","example":"The sloping roof lets rainwater run off easily.","translation":"倾斜的屋顶让雨水容易流走。"},{"id":"环境-135","cat":"环境","word":"photovoltaic","ipa":"ˌfəʊtəʊˌvɒlˈteɪɪk","meaning":"adj. 光电的","example":"The house uses photovoltaic panels to make electricity.","translation":"这所房子使用光伏板来发电。"},{"id":"环境-136","cat":"环境","word":"tile","ipa":"taɪl","meaning":"n. 瓷砖；","example":"They laid new tile in the kitchen.","translation":"他们在厨房铺了新的瓷砖。"},{"id":"环境-137","cat":"环境","word":"geology","ipa":"dʒiˈɒlədʒi","meaning":"n. 地质学","example":"He loves studying geology in high school.","translation":"他喜欢在高中学习地质学。"},{"id":"环境-138","cat":"环境","word" ee.","translation":"他摔倒擦伤了膝盖。"},{"id":"疾病-51","cat":"疾病","word":"baldness","ipa":"ˈbɔːldnəs","meaning":"n. 光秃；露骨","example":"He is worried about his baldness.","translation":"他担心自己的脱发。"},{"id":"疾病-52","cat":"疾病","word":"pregnant","ipa":"ˈpreɡnənt","meaning":"adj. 怀孕的；妊娠的；","example":"She is pregnant and will have a baby next month.","translation":"她怀孕了，下个月就要生宝宝了。"},{"id":"疾病-53","cat":"疾病","word":"Drug","ipa":"drʌɡ","meaning":"n. 药物；毒品；","example":"The doctor prescribed a drug for his headache.","translation":"医生给他开了一种治疗头痛的药物。"},{"id":"疾病-54","cat":"疾病","word":"Medication","ipa":"ˌmedɪˈkeɪʃ(ə)n","meaning":"n. 药物；药物治疗；药物处理；","example":"He took his medication every morning.","translation":"他每天早上吃药。"},{"id":"疾病-55","cat":"疾病","word":"Medicine","ipa":"ˈmedɪs(ə)n","meaning":"n. 医学；药；","example":"He wants to study medicine at university.","translation":"他想在大学学习医学。"},{"id":"疾病-56","cat":"疾病","word":"check","ipa":"tʃek","meaning":"v. 检查；核对；\nn. 检查；支票；阻止；","example":"Please check your homework before class.","translation":"请在上课前检查你的作业。"},{"id":"疾病-57","cat":"疾病","word":"prescribe","ipa":"prɪˈskraɪb","meaning":"v. 开药方；规定","example":"The doctor prescribed medicine for my cold.","translation":"医生给我开了治疗感冒的药。"},{"id":"疾病-58","cat":"疾病","word":"pay-to-use","ipa":"peɪ tuː juːz","meaning":"phrase. 付费使用","example":"This app is pay-to-use.","translation":"这个应用程序是付费使用的。"},{"id":"疾病-59","cat":"疾病","word":"instructions","ipa":"ɪnˈstrʌkʃənz","meaning":"n. 指令；说明；指示；“instruction”的复数；","example":"Follow the instructions on the box.","translation":"按照盒子上的指令操作。"},{"id":"疾病-60","cat":"疾病","word":"dosage","ipa":"ˈdəʊsɪdʒ","meaning":"n. 剂量；","example":"The doctor adjusted the dosage of the medicine.","translation":"医生调整了药物的剂量。"},{"id":"疾病-61","cat":"疾病","word":"intake","ipa":"ˈɪnteɪk","meaning":"n. 摄入量；","example":"The doctor checked his daily intake of sugar.","translation":"医生检查了他每天的糖摄入量。"},{"id":"疾病-62","cat":"疾病","word":"antibiotics","ipa":"ˌæntɪbaɪˈɒtɪks","meaning":"n. 抗生素","example":"The doctor gave me antibiotics for my infection.","translation":"医生给我开了抗生素来治疗感染。"},{"id":"疾病-63","cat":"疾病","word":"side effect","ipa":"ˈsaɪd ɪfekt","meaning":"phrase. 副作用","example":"The medicine has a side effect of dizziness.","translation":"这种药有头晕的副作用。"},{"id":"疾病-64","cat":"疾病","word":"painkiller","ipa":"ˈpeɪnkɪlə(r)","meaning":"n. 止痛药","example":"He took a painkiller for his headache.","translation":"他吃了一片止痛药来缓解头痛。"},{"id":"疾病-65","cat":"疾病","word":"pill","ipa":"pɪl","meaning":"n. 药丸；药片；","example":"He took a pill for his headache.","translation":"他吃了一粒药丸来缓解头痛。"},{"id":"疾病-66","cat":"疾病","word":"tablet","ipa":"ˈtæblət","meaning":"n. 平板电脑；（刻有文字的）匾；","example":"He uses a tablet to read books.","translation":"他用平板电脑读书。"},{"id":"疾病-67","cat":"疾病","word":"capsule","ipa":"ˈkæpsjuːl","meaning":"n. 胶囊；","example":"He took a capsule for his headache.","translation":"他吃了一粒胶囊来缓解头痛。"},{"id":"疾病-68","cat":"疾病","word":"ointment","ipa":"ˈɔɪntmənt","meaning":"n. 药膏；油膏；软膏","example":"He put ointment on his cut.","translation":"他把药膏涂在伤口上。"},{"id":"疾病-69","cat":"疾病","word":"mixture","ipa":"ˈmɪkstʃə(r)","meaning":"n. 混合物；混合；","example":"The recipe calls for a mixture of flour and water.","translation":"这个食谱需要一种面粉和水的混合物。"},{"id":"疾病-70","cat":"疾病","word":"eye drops","ipa":"aɪ drɒps","meaning":"phrase. 眼药水","example":"He uses eye drops when his eyes are itchy.","translation":"当他的眼睛发痒时，他会使用眼药水。"},{"id":"疾病-71","cat":"疾病","word":"syrup","ipa":"ˈsɪrəp","meaning":"n. 糖浆；","example":"He poured syrup on his pancakes.","translation":"他把糖浆倒在煎饼上。"},{"id":"疾病-72","cat":"疾病","word":"pad","ipa":"pæd","meaning":"n. 垫；爪垫；便笺簿\nv. 放轻脚步走","example":"She put a pad on the chair for comfort.","translation":"她在椅子上放了一个垫子以增加舒适感。"},{"id":"疾病-73","cat":"疾病","word":"X-ray","ipa":"ˈeks reɪ eks","meaning":"phrase. 无中文释义","example":"The doctor took an x-ray to check his broken bone.","translation":"医生拍了一张X光片来检查他断裂的骨头。"},{"id":"疾病-74","cat":"疾病","word":"vitamin","ipa":"ˈvɪtəmɪn","meaning":"n. 维生素；维他命；","example":"Eating fruits gives you vitamin C.","translation":"吃水果可以给你维生素C。"},{"id":"疾病-75","cat":"疾病","word":"aspirin","ipa":"ˈæspərɪn","meaning":"n. 阿司匹林（镇痛解热消炎药）","example":"He took aspirin for his headache.","translation":"他吃了阿司匹林来缓解头痛。"},{"id":"疾病-76","cat":"疾病","word":"penicillin","ipa":"ˌpenɪˈsɪlɪn","meaning":"n. 青霉素","example":"The doctor gave him penicillin for his infection.","translation":"医生给他开了青霉素治疗感染。"},{"id":"疾病-77","cat":"疾病","word":"cold cure","ipa":"kəʊld kjʊə(r)","meaning":"phrase. 感冒药","example":"He took a cold cure for his runny nose.","translation":"他吃了感冒药来缓解流鼻涕。"},{"id":"疾病-78","cat":"疾病","word":"vaccinate","ipa":"ˈvæksɪneɪt","meaning":"v. 接种疫苗；预防接种","example":"The doctor will vaccinate the child tomorrow.","translation":"医生明天会给这个孩子接种疫苗。"},{"id":"疾病-79","cat":"疾病","word":"ambulance","ipa":"ˈæmbjələns","meaning":"n. 救护车","example":"The ambulance arrived quickly to help the injured man.","translation":"救护车迅速到达以帮助受伤的男人。"},{"id":"疾病-80","cat":"疾病","word":"solution","ipa":"səˈluːʃ(ə)n","meaning":"n. 解决办法；溶液；","example":"The solution to the problem is simple.","translation":"这个问题的解决办法很简单。"},{"id":"疾病-81","cat":"疾病","word":"pharmacy","ipa":"ˈfɑːməsi","meaning":"n. 药房；药剂学；","example":"He works at a small pharmacy near the park.","translation":"他在公园附近的一家小药房工作。"},{"id":"疾病-82","cat":"疾病","word":"chemist's","ipa":"ˈkemɪsts","meaning":"n. 药店","example":"He bought medicine at the chemist's.","translation":"他在药房买了药。"},{"id":"疾病-83","cat":"疾病","word":"drug store","ipa":"drʌɡ stɔː(r)","meaning":"phrase. 药店","example":"He bought medicine at the drug store.","translation":"他在药店买了药。"},{"id":"疾病-84","cat":"疾病","word":"Treatment","ipa":"ˈtriːtmənt","meaning":"n. 治疗；处理；待遇；","example":"The doctor gave him proper treatment for the infection.","translation":"医生给他提供了针对感染的适当治疗。"},{"id":"疾病-85","cat":"疾病","word":"Therapy","ipa":"ˈθerəpi","meaning":"n. 治疗；疗法；","example":"He is receiving therapy for his back pain.","translation":"他正在接受治疗以缓解背痛。"},{"id":"疾病-86","cat":"疾病","word":"acupunctu t.cat))}function pool(mode){let a=scope();if(mode==='daily'){let todayNew=a.filter(w=>status(w).first===today());let fresh=a.filter(w=>!learned(w)&&!status(w).first);return [...todayNew,...fresh.slice(0,Math.max(0,20-todayNew.length))].slice(0,20)}if(mode==='due')return a.filter(due);if(mode==='wrong')return a.filter(wrong);return a}function begin(t,mode){setTab(t);session=pool(mode);pos=0;revealed=false;spellChecked=false;if(mode==='daily')session.forEach(w=>{if(!status(w).first){db[w.id]={...status(w),first:today()}}});save();renderSession()}function shuffleSession(){for(let i=session.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[session[i],session[j]]=[session[j],session[i]]}pos=0;renderSession()}function speak(word){if(!('speechSynthesis'in window)){toast('当前浏览器不支持语音');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='en-GB';u.rate=.83;speechSynthesis.speak(u)}function renderSession(){let target=document.getElementById(tab==='spelling'?'spellSession':'cardSession');if(!target)return;if(!session.length){target.innerHTML='<div class="empty">当前范围没有待学单词。可以切换到“全部单词”继续练习。</div>';return}if(pos>=session.length){target.innerHTML=`<div style="font-size:52px">🎉</div><h2>本轮完成！</h2><p class="muted">已完成 ${session.length} 个词汇的学习或测试。</p><button class="btn" onclick="begin('${tab}','due')">继续到期复习</button>`;return}let w=session[pos],s=status(w),top=`<div class="progress">${escapeHtml(w.cat)} · ${pos+1} / ${session.length}</div><div class="bar"><div style="width:${pos/session.length*100}%"></div></div>`;if(tab==='cards'){target.innerHTML=top+`<div class="word">${escapeHtml(w.word)}</div><div class="ipa">${escapeHtml(w.ipa)}</div><button class="btn light" style="margin-top:17px" onclick="speak(WORDS.find(w=>w.id===session[pos].id).word)">🔊 英式发音</button>${revealed?`<div class="answer"><div class="meaning">${escapeHtml(w.meaning)}</div><div class="example">${escapeHtml(w.example)}</div><div class="small">${escapeHtml(w.translation)}</div></div><div class="studyactions"><button class="btn red" onclick="grade(false)">不认识 · 明日复习</button><button class="btn" onclick="grade(true)">认识 · 记住了</button></div>`:`<div class="hint" style="margin:30px 0">先回忆词义，再翻开答案</div><button class="btn" onclick="revealed=true;renderSession()">显示中文释义与例句</button>`}`;return}target.innerHTML=top+`<div class="hint" style="margin-top:24px">请根据中文释义，拼写完整英文单词或词组</div><div class="meaning">${escapeHtml(w.meaning)}</div><div class="example">${escapeHtml(w.translation)}</div><div class="ipa" style="margin:10px">${escapeHtml(w.ipa)}</div><div class="controls" style="justify-content:center;margin:24px 0"><input id="spellInput" style="width:min(380px,100%);text-align:center;font-size:21px" autocomplete="off" spellcheck="false" placeholder="输入英文拼写" ${spellChecked?'disabled':''}><button class="btn light" onclick="speak(session[pos].word)">🔊 听发音</button></div><div id="spellResult"></div><div class="studyactions" id="spellActions"><button class="btn" onclick="checkSpelling()">检查拼写 ↵</button><button class="btn ghost" onclick="skipSpell()">不会 / 跳过</button></div>`;let inp=document.getElementById('spellInput');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')checkSpelling()}}function normalized(s){return s.trim().replace(/\s+/g,' ').toLowerCase()}function checkSpelling(){if(spellChecked)return;let inp=document.getElementById('spellInput');if(!inp)return;let answer=inp.value;if(!answer.trim()){toast('请先输入英文答案');return}let w=session[pos],ok=normalized(answer)===normalized(w.word);mark(w,ok);spellChecked=true;inp.disabled=true;document.getElementById('spellResult').innerHTML=`<div class="answer" style="background:${ok?'#e9f8f1':'#fff0f2'}"><b style="color:${ok?'#16835f':'#df5368'}">${ok?'✓ 拼写正确':'✕ 拼写错误'}</b><div class="word" style="font-size:25px;margin:8px 0">${escapeHtml(w.word)}</div><div class="small">${escapeHtml(w.example)}</div></div>`;document.getElementById('spellActions').innerHTML='<button class="btn" onclick="nextWord()">下一词 →</button>'}function skipSpell(){mark(session[pos],false);spellChecked=true;let w=session[pos];document.getElementById('spellResult').innerHTML=`<div class="answer">正确拼写：<b>${escapeHtml(w.word)}</b></div>`;document.getElementById('spellActions').innerHTML='<button class="btn" onclick="nextWord()">下一词 →</button>';document.getElementById('spellInput').disabled=true}function grade(ok){mark(session[pos],ok);nextWord()}function nextWord(){pos++;revealed=false;spellChecked=false;renderSession()}function renderReview(){let a=scope();document.getElementById('reviewStats').innerHTML=[[a.filter(due).length,'到期复习'],[a.filter(wrong).length,'待攻克错词'],[a.filter(mastered).length,'已掌握'],[a.filter(learned).length,'累计学习']].map(([n,l])=>`<div class="stat"><span>${l}</span><b>${n}</b></div>`).join('');let list=a.filter(wrong).slice(0,100);document.getElementById('wrongTable').innerHTML=list.length?`<table class="table"><thead><tr><th>单词</th><th>释义</th><th>场景</th><th>累计错误</th><th>下次复习</th></tr></thead><tbody>${list.map(w=>`<tr><td>${escapeHtml(w.word)}</td><td>${escapeHtml(w.meaning)}</td><td>${escapeHtml(w.cat)}</td><td>${status(w).errors}</td><td>${status(w).due||'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无错词。开始拼写训练后，错误词汇会自动收录。</div>'}function renderLibrary(){let q=document.getElementById('search').value.trim().toLowerCase(),f=document.getElementById('filter').value;order=scope().filter(w=>(w.word+' '+w.meaning+' '+w.example).toLowerCase().includes(q)&&(f==='all'||f==='known'&&mastered(w)||f==='wrong'&&wrong(w)||f==='new'&&!learned(w)));limit=60;drawRows()}function drawRows(){document.getElementById('resultCount').textContent=`找到 ${order.length} 个词汇条目（相同英文词在不同场景保留独立条目）`;document.getElementById('libraryTable').innerHTML=`<table class="table"><thead><tr><th>英文 / 音标</th><th>中文释义</th><th>场景</th><th>学习状态</th><th>发音</th></tr></thead><tbody>${order.slice(0,limit).map(w=>`<tr><td>${escapeHtml(w.word)}<div class="small">${escapeHtml(w.ipa)}</div></td><td>${escapeHtml(w.meaning)}<div class="small">${escapeHtml(w.example)}</div></td><td>${escapeHtml(w.cat)}</td><td>${mastered(w)?'✓ 已掌握':wrong(w)?'<span class="reviewbadge">待复习</span>':learned(w)?'学习中':'未学习'}</td><td><button class="btn ghost" data-speak="${escapeHtml(w.id)}">🔊</button></td></tr>`).join('')}</tbody></table>`;document.getElementById('loadMore').style.display=limit>=order.length?'none':'';document.querySelectorAll('[data-speak]').forEach(e=>e.onclick=()=>{let w=WORDS.find(w=>w.id===e.dataset.speak);if(w)speak(w.word)})}function loadMore(){limit+=60;drawRows()}document.getElementById('search').oninput=renderLibrary;document.getElementById('filter').onchange=renderLibrary;document.getElementById('backup').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),progress:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='IELTS-13场景-学习进度-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!data.progress||typeof data.progress!=='object')throw Error('文件格式不正确');if(!confirm('导入将覆盖当前学习记录，确定继续吗？'))return;db=data.progress;save();renderHome();renderLibrary();toast('学习记录已恢复')}catch(err){toast('导入失败：'+err.message)}e.target.value=''};renderHome();</script></body></html>
